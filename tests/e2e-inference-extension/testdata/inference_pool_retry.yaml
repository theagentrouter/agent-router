# A pool member that is Ready but refuses every connection to the pool's target port 8080:
# it passes its readiness probe on a different port (8081), which is the only port it listens on.
# Kubernetes, the endpoint picker and Envoy all see it as a healthy member of the mistral pool.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mistral-upstream-broken
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mistral-upstream
      broken: "true"
  template:
    metadata:
      labels:
        app: mistral-upstream
        broken: "true"
    spec:
      containers:
        - name: testupstream
          image: docker.io/envoyproxy/ai-gateway-testupstream:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: TESTUPSTREAM_ID
              value: broken
            - name: LISTENER_PORT
              value: "8081"
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 1
            periodSeconds: 1
---
# Retries a failed attempt on the route generated by the AIGatewayRoute. With a retry policy,
# Envoy Gateway adds the previous_hosts retry host predicate, so a retry should leave the endpoint
# that just failed.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: mistral-retry
  namespace: default
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: inference-pool-with-aigwroute
  retry:
    numAttemptsPerPriority: 1
    numRetries: 2
    perRetry:
      backOff:
        baseInterval: 10ms
        maxInterval: 100ms
    retryOn:
      triggers:
        - connect-failure
        - reset
        - 5xx
