# A FailOpen InferencePool, its model server Pods and its endpoint picker in a namespace other
# than the Gateway's and the route's. The fallback Service the controller creates for the pool
# must be in the pool's namespace, where the Pods are.
apiVersion: v1
kind: Namespace
metadata:
  name: failopen-xns
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xns-pool-upstream
  namespace: failopen-xns
spec:
  replicas: 3
  selector:
    matchLabels:
      app: xns-pool-upstream
  template:
    metadata:
      labels:
        app: xns-pool-upstream
    spec:
      containers:
        - name: p8080
          image: docker.io/envoyproxy/ai-gateway-testupstream:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # The response header testupstream-id then tells which pod and port served a request.
            - name: TESTUPSTREAM_ID
              value: "$(POD_NAME)-8080"
            - name: LISTENER_PORT
              value: "8080"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 1
            periodSeconds: 1
---
apiVersion: inference.networking.k8s.io/v1
kind: InferencePool
metadata:
  name: xns-pool
  namespace: failopen-xns
spec:
  targetPorts:
    - number: 8080
  selector:
    matchLabels:
      app: xns-pool-upstream
  endpointPickerRef:
    name: xns-pool-epp
    failureMode: FailOpen
    port:
      number: 9002
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: xns-pool-epp
  namespace: failopen-xns
---
apiVersion: v1
kind: Service
metadata:
  name: xns-pool-epp
  namespace: failopen-xns
spec:
  selector:
    app: xns-pool-epp
  ports:
    - protocol: TCP
      port: 9002
      targetPort: 9002
      appProtocol: http2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xns-pool-epp
  namespace: failopen-xns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xns-pool-epp
  template:
    metadata:
      labels:
        app: xns-pool-epp
    spec:
      serviceAccountName: xns-pool-epp
      terminationGracePeriodSeconds: 5
      containers:
        - name: epp
          image: ghcr.io/llm-d/llm-d-router-endpoint-picker:main
          imagePullPolicy: IfNotPresent
          args:
            - --pool-name
            - "xns-pool"
            - "--pool-namespace"
            - "failopen-xns"
            # Level 4 makes the endpoint picker log the endpoint it chose for each request.
            - --v
            - "4"
            - --zap-encoder
            - "json"
            - --grpc-port
            - "9002"
            - --grpc-health-port
            - "9003"
            - "--config-file"
            - "/config/default-plugins.yaml"
          ports:
            - containerPort: 9002
            - containerPort: 9003
          readinessProbe:
            grpc:
              port: 9003
              service: inference-extension
            initialDelaySeconds: 2
            periodSeconds: 2
          volumeMounts:
            - name: plugins-config-volume
              mountPath: "/config"
      volumes:
        - name: plugins-config-volume
          configMap:
            name: xns-pool-epp-plugins-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: xns-pool-epp-plugins-config
  namespace: failopen-xns
data:
  default-plugins.yaml: |
    apiVersion: llm-d.ai/v1alpha1
    kind: EndpointPickerConfig
    plugins:
    - type: queue-scorer
    - type: kv-cache-utilization-scorer
    - type: prefix-cache-scorer
    schedulingProfiles:
    - name: default
      plugins:
      - pluginRef: queue-scorer
      - pluginRef: kv-cache-utilization-scorer
      - pluginRef: prefix-cache-scorer
---
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: xns-pool-epp-pod-read
  namespace: failopen-xns
rules:
  - apiGroups: ["inference.networking.k8s.io"]
    resources: ["inferencepools"]
    verbs: ["get", "watch", "list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "watch", "list"]
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: xns-pool-epp-pod-read-binding
  namespace: failopen-xns
subjects:
  - kind: ServiceAccount
    name: xns-pool-epp
    namespace: failopen-xns
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: xns-pool-epp-pod-read
---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: xns-pool-epp-auth-reviewer
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["subjectaccessreviews"]
    verbs: ["create"]
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: xns-pool-epp-auth-reviewer-binding
subjects:
  - kind: ServiceAccount
    name: xns-pool-epp
    namespace: failopen-xns
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: xns-pool-epp-auth-reviewer
---
# Lets the AIGatewayRoute below, and the HTTPRoute the controller generates from it, reference
# the InferencePool from the default namespace.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: xns-pool-from-default
  namespace: failopen-xns
spec:
  from:
    - group: aigateway.envoyproxy.io
      kind: AIGatewayRoute
      namespace: default
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: default
  to:
    - group: inference.networking.k8s.io
      kind: InferencePool
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIGatewayRoute
metadata:
  name: xns-pool
  namespace: default
spec:
  parentRefs:
    - name: inference-pool-with-aigwroute
      kind: Gateway
      group: gateway.networking.k8s.io
  rules:
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: xns-model
      backendRefs:
        - group: inference.networking.k8s.io
          kind: InferencePool
          name: xns-pool
          namespace: failopen-xns
