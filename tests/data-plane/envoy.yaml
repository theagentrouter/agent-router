admin:
  address:
    socket_address:
      address: 127.0.0.1
      port_value: 9901

static_resources:
  listeners:
    - address:
        socket_address:
          address: 0.0.0.0
          port_value: 1062
      per_connection_buffer_limit_bytes: 52428800
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                codec_type: auto
                access_log:
                  - name: log_used_token
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        json_format:
                          used_token: "%DYNAMIC_METADATA(io.envoy.ai_gateway:used_token)%"
                          some_cel: "%DYNAMIC_METADATA(io.envoy.ai_gateway:some_cel)%"
                  - name: default
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StderrAccessLog
                route_config:
                  virtual_hosts:
                    - name: local_route
                      # TODO: move this at route level to match the behavior of EG.
                      retry_policy:
                        retry_on: "5xx,gateway-error,reset,rest-before-request,connect-failure,envoy-ratelimited,retriable-4xx,refused-stream,retriable-status-codes,retriable-headers"
                        num_retries: 5
                        per_try_timeout: "30s"
                        retry_priority:
                          name: envoy.retry_priorities.previous_priorities
                          typedConfig:
                            "@type": type.googleapis.com/envoy.extensions.retry.priority.previous_priorities.v3.PreviousPrioritiesConfig
                            updateFrequency: 1
                        retry_back_off:
                          base_interval: "0.1s"
                          max_interval: "1s"
                      domains:
                        - "*"
                      routes:
                        - match:
                            prefix: "/"
                            headers:
                              - name: x-ai-eg-model
                                string_match:
                                  exact: us.amazon.nova-micro-v1:0
                          route:
                            auto_host_rewrite: true
                            cluster: aws_bedrock
                        - match:
                            prefix: "/"
                            headers:
                              - name: x-ai-eg-model
                                string_match:
                                  exact: claude-sonnet-4-5
                          route:
                            auto_host_rewrite: true
                            cluster: anthropic
                        - match:
                            prefix: "/"
                            headers:
                              - name: x-ai-eg-model
                                string_match:
                                  exact: global.anthropic.claude-sonnet-4-5-20250929-v1:0
                          route:
                            auto_host_rewrite: true
                            cluster: anthropic_aws_bedrock
                        - match:
                            prefix: "/"
                            headers:
                              - name: x-ai-eg-model
                                string_match:
                                  exact: us.anthropic.claude-sonnet-4-5-20250929-v1:0
                          route:
                            auto_host_rewrite: true
                            cluster: aws_bedrock
                        - match:
                            prefix: "/"
                            headers:
                              - name: x-ai-eg-model
                                string_match:
                                  exact: gpt-5-nano
                          route:
                            auto_host_rewrite: true
                            cluster: openai
                        - match:
                            prefix: "/"
                            headers:
                              - name: x-ai-eg-model
                                string_match:
                                  exact: text-embedding-3-small
                          route:
                            auto_host_rewrite: true
                            cluster: openai
                        - match:
                            prefix: "/"
                            headers:
                              - name: x-ai-eg-model
                                string_match:
                                  exact: amazon.titan-embed-text-v2:0
                          route:
                            auto_host_rewrite: true
                            cluster: aws_bedrock
                        - match:
                            prefix: "/"
                            headers:
                              - name: x-ai-eg-model
                                string_match:
                                  exact: o1
                          route:
                            auto_host_rewrite: true
                            cluster: azure_openai
                        - match:
                            prefix: "/"
                            headers:
                              - name: x-ai-eg-model
                                string_match:
                                  exact: gemini-3.1-flash-lite
                          route:
                            auto_host_rewrite: true
                            cluster: gemini
                        - match:
                            prefix: "/"
                            headers:
                              - name: x-ai-eg-model
                                string_match:
                                  exact: gemini-embedding-001
                          route:
                            auto_host_rewrite: true
                            cluster: gemini
                        - match:
                            prefix: "/"
                            headers:
                              - name: x-ai-eg-model
                                string_match:
                                  exact: llama-3.1-8b-instant
                          route:
                            auto_host_rewrite: true
                            cluster: groq
                        - match:
                            prefix: "/"
                            headers:
                              - name: x-ai-eg-model
                                string_match:
                                  exact: grok-3
                          route:
                            auto_host_rewrite: true
                            cluster: grok
                        - match:
                            prefix: "/"
                            headers:
                              - name: x-ai-eg-model
                                string_match:
                                  exact: Meta-Llama-3.1-8B-Instruct
                          route:
                            auto_host_rewrite: true
                            cluster: sambanova
                        - match:
                            prefix: "/"
                            headers:
                              - name: x-ai-eg-model
                                string_match:
                                  exact: E5-Mistral-7B-Instruct
                          route:
                            auto_host_rewrite: true
                            cluster: sambanova
                        - match:
                            prefix: "/"
                            headers:
                              - name: x-ai-eg-model
                                string_match:
                                  exact: meta-llama/Meta-Llama-3-8B-Instruct
                          route:
                            auto_host_rewrite: true
                            cluster: deepinfra
                        - match:
                            prefix: "/"
                            headers:
                              - name: x-ai-eg-model
                                string_match:
                                  exact: BAAI/bge-base-en-v1.5
                          route:
                            auto_host_rewrite: true
                            cluster: deepinfra
                        - match:
                            prefix: "/"
                            headers:
                              - name: x-test-backend
                                string_match:
                                  exact: openai
                          route:
                            cluster: testupstream-openai
                          metadata:
                            filter_metadata:
                              aigateway.envoy.io:
                                route_name: "test-ns/openai-route"
                        - match:
                            prefix: "/"
                            headers:
                              - name: x-test-backend
                                string_match:
                                  exact: anthropic
                          route:
                            cluster: testupstream-anthropic
                        - match:
                            prefix: "/"
                            headers:
                              - name: x-test-backend
                                string_match:
                                  exact: modelname-override
                          route:
                            cluster: testupstream-modelname-override
                          metadata:
                            filter_metadata:
                              aigateway.envoy.io:
                                route_name: "test-ns/modelname-override-route"
                        - match:
                            prefix: "/"
                            headers:
                              - name: x-test-backend
                                string_match:
                                  exact: aws-bedrock
                          route:
                            cluster: testupstream-aws
                        - match:
                            prefix: "/"
                            headers:
                              - name: x-test-backend
                                string_match:
                                  exact: azure-openai
                          route:
                            cluster: testupstream-azure
                        - match:
                            prefix: "/"
                            headers:
                              - name: x-test-backend
                                string_match:
                                  exact: gcp-vertexai
                          route:
                            cluster: testupstream-gcp-vertexai
                        - match:
                            prefix: "/"
                            headers:
                              - name: x-test-backend
                                string_match:
                                  exact: gcp-anthropicai
                          route:
                            cluster: testupstream-gcp-anthropicai
                        - match:
                            prefix: "/"
                            headers:
                              - name: x-test-backend
                                string_match:
                                  exact: aws-anthropic
                          route:
                            cluster: testupstream-aws-anthropic
                        - match:
                            prefix: "/"
                            headers:
                              - name: x-test-backend
                                string_match:
                                  exact: modelname-override-and-fallback
                          route:
                            cluster: testupstream-modelname-override-and-fallback
                        - match:
                            prefix: "/"
                            headers:
                              - name: x-test-backend
                                string_match:
                                  exact: body-mutation
                          route:
                            cluster: testupstream-body-mutation
                        - match:
                            prefix: "/"
                            headers:
                              - name: x-test-backend
                                string_match:
                                  exact: body-mutation-anthropic
                          route:
                            cluster: testupstream-body-mutation-anthropic
                        - match:
                            prefix: "/"
                            headers:
                              - name: x-test-backend
                                string_match:
                                  exact: dynmd-cred
                          route:
                            cluster: testupstream-dynmd-cred
                        - match:
                            prefix: "/"
                            headers:
                              - name: x-test-backend
                                string_match:
                                  exact: aws-dynmd-cred
                          route:
                            cluster: testupstream-aws-dynmd-cred
                http_filters:
                  # Stand-in for a trusted credential-resolving filter (e.g. ext_authz): turns the
                  # x-test-dynmd-api-key request header into dynamic metadata and removes the
                  # header, so the credential reaches the extproc only if the upstream ext_proc
                  # filter's forwarding_namespaces actually delivers downstream-set metadata.
                  - name: envoy.filters.http.header_to_metadata
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.header_to_metadata.v3.Config
                      request_rules:
                        - header: x-test-dynmd-api-key
                          on_header_present:
                            metadata_namespace: test.credential.injector
                            key: api-key
                            type: STRING
                          remove: true
                  # Stand-in producer of a struct-valued AWS credential, the shape
                  # credentialOverride.fromDynamicMetadata expects for AWSCredentials. Struct
                  # delivery is worth proving separately: ext_proc request_attributes cannot carry
                  # structs, forwarding_namespaces must.
                  - name: envoy.filters.http.set_metadata
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.set_metadata.v3.Config
                      metadata:
                        - metadata_namespace: test.aws.credential.injector
                          allow_overwrite: true
                          value:
                            x-aigw-aws-credentials:
                              accessKeyId: ASIADYNAMICMETADATA
                              secretAccessKey: metadata-secret
                              sessionToken: session-token-from-dynamic-metadata
                  - name: envoy.filters.http.ext_proc
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
                      allow_mode_override: true
                      processing_mode:
                        request_header_mode: "SEND"
                        request_body_mode: "BUFFERED"
                        response_header_mode: "SEND"
                        response_body_mode: "BUFFERED"
                      grpc_service:
                        envoy_grpc:
                          cluster_name: extproc_cluster
                        timeout: 30s
                      message_timeout: 60s
                      metadataOptions:
                        receivingNamespaces:
                          untyped:
                            - io.envoy.ai_gateway
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                      suppressEnvoyHeaders: true

  clusters:
    - name: extproc_cluster
      connect_timeout: 5s
      type: STATIC
      lb_policy: ROUND_ROBIN
      per_connection_buffer_limit_bytes: 52428800
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options:
              connection_keepalive:
                interval: 30s
                timeout: 5s
      load_assignment:
        cluster_name: extproc_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 127.0.0.1
                      port_value: 1063
    - name: testupstream-openai
      connect_timeout: 0.25s
      type: STATIC
      per_connection_buffer_limit_bytes: 52428800
      lb_policy: ROUND_ROBIN
      outlier_detection:
        consecutive_5xx: 1
        interval: 1s
        base_ejection_time: 2s # Must be smaller than the require.Eventually's interval. Otherwise, the tests may pass without going through the fallback since the always-failing backend could be ejected by the time when require.Eventually retries due to the previous request IF the retry is not configured.
        max_ejection_percent: 100
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http_protocol_options: {}
          http_filters:
            - name: upstream_extproc
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
                allow_mode_override: true
                request_attributes:
                  - xds.upstream_host_metadata.filter_metadata['aigateway.envoy.io']['per_route_rule_backend_name']
                processing_mode:
                  request_header_mode: "SEND"
                  request_body_mode: "NONE"
                  response_header_mode: "SKIP"
                  response_body_mode: "NONE"
                grpc_service:
                  envoy_grpc:
                    cluster_name: extproc_cluster
                  timeout: 30s
                message_timeout: 60s
                metadataOptions:
                  receivingNamespaces:
                    untyped:
                      - io.envoy.ai_gateway
            - name: envoy.filters.http.header_mutation
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.http.header_mutation.v3.HeaderMutation
                mutations:
                  request_mutations:
                    - append:
                        append_action: ADD_IF_ABSENT
                        header:
                          key: content-length
                          value: "%DYNAMIC_METADATA(io.envoy.ai_gateway:content_length)%"
            - name: envoy.filters.http.upstream_codec
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.http.upstream_codec.v3.UpstreamCodec
      load_assignment:
        cluster_name: testupstream-openai
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 127.0.0.1
                      port_value: 8080
                metadata:
                  filter_metadata:
                    aigateway.envoy.io:
                      per_route_rule_backend_name: "testupstream-openai"
