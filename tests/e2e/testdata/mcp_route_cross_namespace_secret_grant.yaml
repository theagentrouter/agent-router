# Allows the MCPRoutes of TestMCPRouteCrossNamespaceSecret to read mcp-cross-ns-creds/mcp-backend-token.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-mcp-cross-ns-route
  namespace: mcp-cross-ns-creds
spec:
  from:
    - group: aigateway.envoyproxy.io
      kind: MCPRoute
      namespace: mcp-cross-ns-route
  to:
    - group: ""
      kind: Secret
      name: mcp-backend-token
