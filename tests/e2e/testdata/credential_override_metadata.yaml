# Per-request credential from ext_authz dynamic metadata. The auth server returns an API key for
# tenant-a and the BackendSecurityPolicy sources its credential from that metadata. The Gateway
# references a GatewayConfig that does not exist yet: the test applies it later
# (credential_override_metadata_gwconfig.yaml) to declare the forwarding namespace and check that
# the config change alone reaches the running gateway.

apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy-ai-gateway-credential-override
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: envoy-ai-gateway-credential-override
  namespace: default
  annotations:
    aigateway.envoyproxy.io/gateway-config: envoy-ai-gateway-credential-override
spec:
  gatewayClassName: envoy-ai-gateway-credential-override
  listeners:
    - name: http
      protocol: HTTP
      port: 80
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: envoy-ai-gateway-credential-override
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: envoy-ai-gateway-credential-override
  namespace: default
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        container:
          # Clear the default memory/cpu requirements for local tests.
          resources: {}
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIGatewayRoute
metadata:
  name: envoy-ai-gateway-credential-override
  namespace: default
spec:
  parentRefs:
    - name: envoy-ai-gateway-credential-override
      kind: Gateway
      group: gateway.networking.k8s.io
  rules:
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: credential-override-model
      backendRefs:
        - name: envoy-ai-gateway-credential-override-testupstream
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: envoy-ai-gateway-credential-override-testupstream
  namespace: default
spec:
  schema:
    name: OpenAI
  backendRef:
    name: envoy-ai-gateway-credential-override-testupstream
    kind: Backend
    group: gateway.envoyproxy.io
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: envoy-ai-gateway-credential-override-testupstream
  namespace: default
spec:
  endpoints:
    - fqdn:
        hostname: envoy-ai-gateway-credential-override-testupstream.default.svc.cluster.local
        port: 80
---
apiVersion: v1
kind: Secret
metadata:
  name: envoy-ai-gateway-credential-override-apikey
  namespace: default
stringData:
  apiKey: static-configured-key
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: BackendSecurityPolicy
metadata:
  name: envoy-ai-gateway-credential-override
  namespace: default
spec:
  targetRefs:
    - group: aigateway.envoyproxy.io
      kind: AIServiceBackend
      name: envoy-ai-gateway-credential-override-testupstream
  type: APIKey
  apiKey:
    secretRef:
      name: envoy-ai-gateway-credential-override-apikey
  credentialOverride:
    fromDynamicMetadata:
      namespace: envoy.filters.http.ext_authz
      key: x-aigw-api-key
---
# ext_authz that returns the tenant's API key as dynamic metadata.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: envoy-ai-gateway-credential-override-extauth
  namespace: default
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-ai-gateway-credential-override
  extAuth:
    grpc:
      backendRefs:
        - name: ext-auth-server-credential-override
          port: 1073
---
apiVersion: apps/v1
kind: Deployment
metadata:
  # Suffixed so this doesn't collide with the ext-auth-servers other tests create in the same
  # namespace.
  name: ext-auth-server-credential-override
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ext-auth-server-credential-override
  template:
    metadata:
      labels:
        app: ext-auth-server-credential-override
    spec:
      containers:
        - name: ext-auth-server
          image: docker.io/envoyproxy/ai-gateway-testextauthserver:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 1073
          env:
            # No EXT_AUTH_ALLOWED_VALUE: allow all requests. tenant-a gets a per-request API key
            # in the metadata; any other tenant gets none, so the static credential applies.
            - name: EXT_AUTH_DYNAMIC_METADATA_HEADER
              value: x-tenant-id
            - name: EXT_AUTH_DYNAMIC_METADATA_BY_HEADER
              value: |
                {"tenant-a": {"x-aigw-api-key": "tenant-a-per-request-key"}}
---
apiVersion: v1
kind: Service
metadata:
  name: ext-auth-server-credential-override
  namespace: default
spec:
  selector:
    app: ext-auth-server-credential-override
  ports:
    - port: 1073
      targetPort: 1073
      appProtocol: grpc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: envoy-ai-gateway-credential-override-testupstream
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: envoy-ai-gateway-credential-override-testupstream
  template:
    metadata:
      labels:
        app: envoy-ai-gateway-credential-override-testupstream
    spec:
      containers:
        - name: testupstream
          image: docker.io/envoyproxy/ai-gateway-testupstream:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: TESTUPSTREAM_ID
              value: test
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: envoy-ai-gateway-credential-override-testupstream
  namespace: default
spec:
  selector:
    app: envoy-ai-gateway-credential-override-testupstream
  ports:
    - port: 80
      targetPort: 8080
