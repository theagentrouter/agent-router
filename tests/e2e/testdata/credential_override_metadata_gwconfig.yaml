# The GatewayConfig referenced by the Gateway in credential_override_metadata.yaml. Applied
# mid-test: declaring the namespace must reach the running gateway on its own (the controller
# stamps a config hash on the Gateway, Envoy Gateway re-translates, and the upstream ext_proc
# filter starts forwarding the ext_authz metadata).
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: GatewayConfig
metadata:
  name: envoy-ai-gateway-credential-override
  namespace: default
spec:
  extProc:
    metadataForwardingNamespaces:
      - envoy.filters.http.ext_authz
