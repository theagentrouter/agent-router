# Shared AI Gateway rate limit service used by QuotaPolicy e2e tests.
# Reads QuotaPolicy configs via xDS from the AI Gateway controller and
# enforces quota-based rate limiting for upstream clusters.
# Must be named envoy-ai-gateway-ratelimit — that is the host Envoy is configured to dial.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: envoy-ai-gateway-ratelimit
  namespace: envoy-gateway-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: envoy-ai-gateway-ratelimit
  template:
    metadata:
      labels:
        app: envoy-ai-gateway-ratelimit
    spec:
      containers:
        - name: ratelimit
          command:
            - /bin/ratelimit
          image: docker.io/envoyproxy/ratelimit:1631871c
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
              name: grpc
          args:
            - --quotaRateLimitServiceAddr=envoy-ai-gateway-ratelimit.envoy-gateway-system
          env:
            - name: LOG_LEVEL
              value: debug
            - name: REDIS_SOCKET_TYPE
              value: tcp
            - name: REDIS_URL
              value: redis.redis-system.svc.cluster.local:6379
            - name: RUNTIME_ROOT
              value: /data
            - name: RUNTIME_SUBDIRECTORY
              value: ratelimit
            - name: USE_STATSD
              value: "false"
            - name: CONFIG_TYPE
              value: GRPC_XDS_SOTW
            - name: CONFIG_GRPC_XDS_NODE_ID
              value: envoy-ai-gateway-ratelimit
            - name: CONFIG_GRPC_XDS_SERVER_URL
              value: ai-gateway-controller.envoy-ai-gateway-system.svc.cluster.local:18002
            - name: GRPC_PORT
              value: "8081"
---
apiVersion: v1
kind: Service
metadata:
  name: envoy-ai-gateway-ratelimit
  namespace: envoy-gateway-system
spec:
  selector:
    app: envoy-ai-gateway-ratelimit
  ports:
    - name: grpc
      protocol: TCP
      port: 8081
      targetPort: 8081
  type: ClusterIP
