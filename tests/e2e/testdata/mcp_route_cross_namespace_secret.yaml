# Fixture for TestMCPRouteCrossNamespaceSecret: MCPRoutes whose backend reads its API key from a Secret
# in another namespace. The ReferenceGrant that allows the reference lives in
# mcp_route_cross_namespace_secret_grant.yaml so the test can add and remove it.
---
apiVersion: v1
kind: Namespace
metadata:
  name: mcp-cross-ns-route
---
apiVersion: v1
kind: Namespace
metadata:
  name: mcp-cross-ns-creds
---
# The Secret the routes reference. Its value is the only one the "granted" backend accepts.
apiVersion: v1
kind: Secret
metadata:
  name: mcp-backend-token
  namespace: mcp-cross-ns-creds
type: Opaque
stringData:
  apiKey: cross-ns-key
---
# A same-named Secret in the route namespace. A controller that ignored secretRef.namespace would copy
# this value, which the backend rejects.
apiVersion: v1
kind: Secret
metadata:
  name: mcp-backend-token
  namespace: mcp-cross-ns-route
type: Opaque
stringData:
  apiKey: wrong-ns-key
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: mcp-gateway-class-cross-ns-secret
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: mcp-gateway-cross-ns-secret
  namespace: mcp-cross-ns-route
spec:
  gatewayClassName: mcp-gateway-class-cross-ns-secret
  listeners:
    - name: http
      protocol: HTTP
      port: 80
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: envoy-mcp-gateway-cross-ns-secret
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: envoy-mcp-gateway-cross-ns-secret
  namespace: mcp-cross-ns-route
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        container:
          # Clear the default memory/cpu requirements for local tests.
          resources: {}
---
# A route with the cross-namespace backend only: without the grant no session can be created at all.
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: MCPRoute
metadata:
  name: mcp-cross-ns-single
  namespace: mcp-cross-ns-route
spec:
  path: /mcp/cross-ns-single
  parentRefs:
    - name: mcp-gateway-cross-ns-secret
      kind: Gateway
      group: gateway.networking.k8s.io
  backendRefs:
    - name: mcp-backend-granted
      port: 1063
      securityPolicy:
        apiKey:
          secretRef:
            name: mcp-backend-token
            namespace: mcp-cross-ns-creds
---
# The same backend next to one with an inline key: the inline backend keeps working while the other one
# is denied.
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: MCPRoute
metadata:
  name: mcp-cross-ns-mixed
  namespace: mcp-cross-ns-route
spec:
  path: /mcp/cross-ns-mixed
  parentRefs:
    - name: mcp-gateway-cross-ns-secret
      kind: Gateway
      group: gateway.networking.k8s.io
  backendRefs:
    - name: mcp-backend-granted
      port: 1063
      securityPolicy:
        apiKey:
          secretRef:
            name: mcp-backend-token
            namespace: mcp-cross-ns-creds
    - name: mcp-backend-local
      port: 1063
      securityPolicy:
        apiKey:
          inline: local-key
---
# Accepts only "Authorization: Bearer cross-ns-key", the value of mcp-cross-ns-creds/mcp-backend-token.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-backend-granted
  namespace: mcp-cross-ns-route
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-backend-granted
  template:
    metadata:
      labels:
        app: mcp-backend-granted
    spec:
      containers:
        - name: mcp-backend-granted
          image: docker.io/envoyproxy/ai-gateway-testmcpserver:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 1063
          env:
            - name: TEST_API_KEY
              value: cross-ns-key
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-backend-granted
  namespace: mcp-cross-ns-route
spec:
  selector:
    app: mcp-backend-granted
  ports:
    - protocol: TCP
      port: 1063
      targetPort: 1063
  type: ClusterIP
---
# Accepts only "Authorization: Bearer local-key", the inline key of the mixed route.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-backend-local
  namespace: mcp-cross-ns-route
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-backend-local
  template:
    metadata:
      labels:
        app: mcp-backend-local
    spec:
      containers:
        - name: mcp-backend-local
          image: docker.io/envoyproxy/ai-gateway-testmcpserver:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 1063
          env:
            - name: TEST_API_KEY
              value: local-key
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-backend-local
  namespace: mcp-cross-ns-route
spec:
  selector:
    app: mcp-backend-local
  ports:
    - protocol: TCP
      port: 1063
      targetPort: 1063
  type: ClusterIP
