apiVersion: aigateway.envoyproxy.io/v1beta1
kind: BackendSecurityPolicy
metadata:
  name: aws-credential-override-policy
  namespace: default
spec:
  type: AWSCredentials
  awsCredentials:
    region: us-east-1
  credentialOverride:
    fromDynamicMetadata:
      namespace: envoy.filters.http.ext_authz
