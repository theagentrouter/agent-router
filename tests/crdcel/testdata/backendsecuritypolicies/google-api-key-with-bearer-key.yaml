apiVersion: aigateway.envoyproxy.io/v1beta1
kind: BackendSecurityPolicy
metadata:
  name: google-api-key-with-bearer-key
  namespace: default
spec:
  targetRefs:
    - group: aigateway.envoyproxy.io
      kind: AIServiceBackend
      name: google-ai-studio
  type: GoogleAPIKey
  googleAPIKey:
    secretRef:
      name: google-api-key
  apiKey:
    secretRef:
      name: bearer-key
