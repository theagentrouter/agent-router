apiVersion: aigateway.envoyproxy.io/v1beta1
kind: BackendSecurityPolicy
metadata:
  name: openai-invalid-token-url-policy
  namespace: default
spec:
  type: OpenAICredentials
  openAICredentials:
    tokenExchange:
      tokenURL: not a url
      subjectToken:
        spiffeJWTSVID:
          audience: https://auth.example.com
