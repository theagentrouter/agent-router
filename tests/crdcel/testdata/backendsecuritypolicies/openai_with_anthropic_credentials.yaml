apiVersion: aigateway.envoyproxy.io/v1beta1
kind: BackendSecurityPolicy
metadata:
  name: openai-with-anthropic-credentials-policy
  namespace: default
spec:
  type: OpenAICredentials
  openAICredentials:
    workloadIdentityFederationConfig:
      identityProviderID: idp_placeholder
      serviceAccountID: sa_placeholder
      subjectToken:
        spiffeJWTSVID:
          audience: https://api.openai.com
  anthropicCredentials:
    workloadIdentityFederationConfig:
      organizationID: 00000000-0000-0000-0000-000000000000
      serviceAccountID: svac_placeholder
      federationRuleID: fdrl_placeholder
      subjectToken:
        spiffeJWTSVID:
          audience: https://api.anthropic.com
