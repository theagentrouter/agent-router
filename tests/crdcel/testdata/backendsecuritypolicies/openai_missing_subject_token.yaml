apiVersion: aigateway.envoyproxy.io/v1beta1
kind: BackendSecurityPolicy
metadata:
  name: openai-missing-subject-token-policy
  namespace: default
spec:
  type: OpenAICredentials
  openAICredentials:
    tokenExchange:
      tokenURL: https://auth.example.com/oauth/token
      subjectToken: {}
