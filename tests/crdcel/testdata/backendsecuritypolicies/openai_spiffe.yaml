apiVersion: aigateway.envoyproxy.io/v1beta1
kind: BackendSecurityPolicy
metadata:
  name: openai-spiffe-policy
  namespace: default
spec:
  type: OpenAICredentials
  openAICredentials:
    organization: org-placeholder
    project: proj_placeholder
    workloadIdentityFederationConfig:
      identityProviderID: idp_placeholder
      serviceAccountID: sa_placeholder
      subjectToken:
        spiffeJWTSVID:
          audience: https://api.openai.com
          socketPath: unix:///run/spire/sockets/agent.sock
