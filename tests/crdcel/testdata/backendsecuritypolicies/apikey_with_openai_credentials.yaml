apiVersion: aigateway.envoyproxy.io/v1beta1
kind: BackendSecurityPolicy
metadata:
  name: apikey-with-openai-credentials-policy
  namespace: default
spec:
  type: APIKey
  apiKey:
    secretRef:
      name: placeholder
  openAICredentials:
    tokenExchange:
      tokenURL: https://auth.example.com/oauth/token
      subjectToken:
        spiffeJWTSVID:
          audience: https://auth.example.com
