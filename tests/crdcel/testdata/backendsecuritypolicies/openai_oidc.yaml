apiVersion: aigateway.envoyproxy.io/v1beta1
kind: BackendSecurityPolicy
metadata:
  name: openai-oidc-policy
  namespace: default
spec:
  type: OpenAICredentials
  openAICredentials:
    workloadIdentityFederationConfig:
      identityProviderID: idp_placeholder
      serviceAccountID: sa_placeholder
      subjectToken:
        oidcExchangeToken:
          oidc:
            provider:
              issuer: https://placeholder
            clientID: placeholder
            clientSecret:
              name: placeholder
