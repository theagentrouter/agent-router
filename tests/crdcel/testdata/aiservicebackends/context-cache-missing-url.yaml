apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: gcp-cache-backend-no-url
  namespace: default
spec:
  schema:
    name: GCPVertexAI
  backendRef:
    name: gcp-service
    kind: Backend
    group: gateway.envoyproxy.io
    port: 443
  contextCache:
    defaultTTL: "600s"
