apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: cat-backend
  namespace: default
spec:
  schema:
    # headerValueFilters is only honored by GCPAnthropic and AWSAnthropic backends, so this is
    # invalid even though "Anthropic" is itself a supported schema.
    name: Anthropic
  backendRef:
    name: dog-service
    kind: Backend
    group: gateway.envoyproxy.io
    port: 80
  headerValueFilters:
    - name: anthropic-beta
      mode: Denylist
      values: ["thinking-token-count-2026-05-13"]
