apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: dog-backend
  namespace: default
spec:
  schema:
    name: AWSAnthropic
  backendRef:
    name: dog-service
    kind: Backend
    group: gateway.envoyproxy.io
    port: 80
  headerValueFilters:
    - name: anthropic-beta
      mode: Allowlist
      values: ["advanced-tool-use-2025-11-20"]
