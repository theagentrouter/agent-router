apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: cat-backend
  namespace: default
spec:
  schema:
    # promptCaching is only honored by GCPAnthropic and AWSAnthropic backends.
    name: OpenAI
  backendRef:
    name: dog-service
    kind: Backend
    group: gateway.envoyproxy.io
    port: 80
  promptCaching:
    cachePoints: Automatic
