apiVersion: aigateway.envoyproxy.io/v1beta1
kind: GuardrailPolicy
metadata:
  name: invalid-action
  namespace: default
spec:
  targetRefs:
    - group: aigateway.envoyproxy.io
      kind: AIServiceBackend
      name: backend
  rules:
    - name: invalid
      phase: Request
      provider:
        type: Regex
        pattern: secret
        action: Log
