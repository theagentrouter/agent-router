apiVersion: aigateway.envoyproxy.io/v1beta1
kind: GatewayConfig
metadata:
  name: forward-proxy-tls-auth
  namespace: default
spec:
  forwardProxy:
    address: proxy.corp:3128
    tls:
      sni: proxy.corp
      caCertificateRef:
        name: proxy-ca
      clientCertificateRef:
        name: proxy-client
    auth:
      basic:
        secretRef:
          name: proxy-creds
