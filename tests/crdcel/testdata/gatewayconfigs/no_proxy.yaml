apiVersion: aigateway.envoyproxy.io/v1beta1
kind: GatewayConfig
metadata:
  name: no-proxy
  namespace: default
spec:
  forwardProxy:
    address: proxy.corp:3128
    noProxy:
      - "*"
      - "localhost"
      - ".internal.corp"
      - "internal.corp"
      - "10.1.2.3"
      - "10.0.0.0/8"
      - "fd00::/8"
