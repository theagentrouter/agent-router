apiVersion: aigateway.envoyproxy.io/v1beta1
kind: GatewayConfig
metadata:
  name: forward-proxy-both-auth
  namespace: default
spec:
  forwardProxy:
    address: proxy.corp:3128
    auth:
      basic:
        secretRef:
          name: proxy-creds
      headerValueRef:
        name: proxy-token
