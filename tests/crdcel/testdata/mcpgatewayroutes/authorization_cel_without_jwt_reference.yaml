# Positive control: a CEL-based authorization rule that does not reference
# request.auth.jwt does not depend on JWT validation, so oauth is not required.
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: MCPRoute
metadata:
  name: authorization-cel-without-jwt-reference
  namespace: default
spec:
  parentRefs:
    - name: some-gateway
      kind: Gateway
      group: gateway.networking.k8s.io
  backendRefs:
    - name: mcp-service
      kind: Service
      port: 80
  securityPolicy:
    authorization:
      rules:
        - cel: 'request.method == "POST"'
          target:
            tools:
              - backend: mcp-service
                tool: echo
