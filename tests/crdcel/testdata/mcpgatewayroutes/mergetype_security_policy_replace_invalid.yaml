apiVersion: aigateway.envoyproxy.io/v1beta1
kind: MCPRoute
metadata:
  name: mergetype-security-policy-replace-invalid-mcp-route
  namespace: default
spec:
  parentRefs:
    - name: some-gateway
      kind: Gateway
      group: gateway.networking.k8s.io
  backendRefs:
    - name: mcp-service
      kind: Service
      port: 80
      path: /mcp
      toolSelector:
        include:
          - run
  securityPolicy:
    mergeType: Replace
    apiKeyAuth:
      credentialRefs:
        - name: client-keys
      extractFrom:
        - headers:
            - x-api-key
