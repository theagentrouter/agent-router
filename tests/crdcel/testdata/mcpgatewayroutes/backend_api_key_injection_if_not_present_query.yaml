# This should fail validation: IfNotPresent is header-injection only.
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: MCPRoute
metadata:
  name: backend-apikey-injection-if-not-present-query
  namespace: default
spec:
  parentRefs:
    - name: some-gateway
      kind: Gateway
      group: gateway.networking.k8s.io
  backendRefs:
    - name: mcp-service
      kind: Service
      port: 80
      securityPolicy:
        apiKey:
          inline: "my-api-key"
          queryParam: "api_key"
          injectionPolicy: IfNotPresent
