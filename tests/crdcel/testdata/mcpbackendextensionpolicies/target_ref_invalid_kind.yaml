# This should fail validation: only MCPRoute targets are supported.
apiVersion: aigateway.envoyproxy.io/v1alpha1
kind: MCPBackendExtensionPolicy
metadata:
  name: target-ref-invalid-kind
  namespace: default
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: my-route
  dynamicModule:
    - name: test-module
      filterName: set_request_header
      config:
        name: x-ext
        value: value
