apiVersion: aigateway.envoyproxy.io/v1alpha1
kind: MCPBackendExtensionPolicy
metadata:
  name: dynamic-module
  namespace: default
spec:
  targetRefs:
    - group: aigateway.envoyproxy.io
      kind: MCPRoute
      name: my-route
  backends:
    - name: sts
      backendRef:
        name: keycloak
        port: 8080
  dynamicModule:
    - name: token-exchange
      config:
        backend: sts
