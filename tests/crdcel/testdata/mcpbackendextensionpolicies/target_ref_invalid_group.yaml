# This should fail validation: only MCPRoute targets in the aigateway.envoyproxy.io group are supported.
apiVersion: aigateway.envoyproxy.io/v1alpha1
kind: MCPBackendExtensionPolicy
metadata:
  name: target-ref-invalid-group
  namespace: default
spec:
  targetRefs:
    - group: example.com
      kind: MCPRoute
      name: my-route
  dynamicModule:
    - name: test-module
      filterName: set_request_header
      config:
        name: x-ext
        value: value
