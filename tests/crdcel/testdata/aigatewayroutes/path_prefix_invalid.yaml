apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIGatewayRoute
metadata:
  name: path-prefix-invalid
  namespace: default
spec:
  parentRefs:
    - name: gateway
  rules:
    - matches:
        - pathPrefix: /gemini/../models
      backendRefs:
        - name: example-backend
