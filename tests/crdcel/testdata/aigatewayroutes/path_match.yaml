apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIGatewayRoute
metadata:
  name: path-match
  namespace: default
spec:
  parentRefs:
    - name: gateway
  rules:
    - matches:
        - pathPrefix: /gemini/v1beta/models
          headers:
            - name: x-ai-eg-model
              value: same-model
        - pathPrefix: /v1/chat/completions
      backendRefs:
        - name: example-backend
