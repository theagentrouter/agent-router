---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  labels:
    gateway.networking.k8s.io/policy: direct
  name: mcpbackendextensionpolicies.aigateway.envoyproxy.io
spec:
  group: aigateway.envoyproxy.io
  names:
    kind: MCPBackendExtensionPolicy
    listKind: MCPBackendExtensionPolicyList
    plural: mcpbackendextensionpolicies
    singular: mcpbackendextensionpolicy
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[-1:].type
      name: Status
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          MCPBackendExtensionPolicy attaches Envoy Gateway extensions to the requests the MCP proxy sends to MCPRoute
          backends.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
            type: string
          metadata:
            type: object
          spec:
            description: Spec defines the details of MCPBackendExtensionPolicy.
            properties:
              backends:
                description: |-
                  Backends declares the callout targets of the extensions.
                  Same type and semantics as EnvoyExtensionPolicy.spec.backends.
                items:
                  description: ExtensionBackend binds an extension's backend alias
                    to a backend resource.
                  properties:
                    backendRef:
                      description: |-
                        BackendRef references the backend for HTTP callouts. References to another
                        namespace require a ReferenceGrant allowing the policy that declares this binding.
                      properties:
                        group:
                          default: ""
                          description: |-
                            Group is the group of the referent. For example, "gateway.networking.k8s.io".
                            When unspecified or empty string, core API group is inferred.
                          maxLength: 253
                          pattern: ^$|^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                          type: string
                        kind:
                          default: Service
                          description: |-
                            Kind is the Kubernetes resource kind of the referent. For example
                            "Service".

                            Defaults to "Service" when not specified.
                          maxLength: 63
                          minLength: 1
                          pattern: ^[a-zA-Z]([-a-zA-Z0-9]*[a-zA-Z0-9])?$
                          type: string
                        name:
                          description: Name is the name of the referent.
                          maxLength: 253
                          minLength: 1
                          type: string
                        namespace:
                          description: |-
                            Namespace is the namespace of the backend. When unspecified, the local
                            namespace is inferred.
                          maxLength: 63
                          minLength: 1
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                          type: string
                        port:
                          description: |-
                            Port specifies the destination port number to use for this resource.
                            Port is required when the referent is a Kubernetes Service.
                          format: int32
                          maximum: 65535
                          minimum: 1
                          type: integer
                      required:
                      - name
                      type: object
                      x-kubernetes-validations:
                      - message: Must have port for Service reference
                        rule: '(size(self.group) == 0 && self.kind == ''Service'')
                          ? has(self.port) : true'
                    backendSettings:
                      description: |-
                        BackendSettings configures connections and traffic for this binding's cluster.
                        Request timeouts and retries are controlled by the extension's callout API.
                      properties:
                        circuitBreaker:
                          description: |-
                            Circuit Breaker settings for the upstream connections and requests.
                            If not set, circuit breakers will be enabled with the default thresholds
                          properties:
                            maxConnections:
                              default: 1024
                              description: The maximum number of connections that
                                Envoy will establish to the referenced backend defined
                                within a xRoute rule.
                              format: int64
                              maximum: 4294967295
                              minimum: 0
                              type: integer
                            maxParallelRequests:
                              default: 1024
                              description: The maximum number of parallel requests
                                that Envoy will make to the referenced backend defined
                                within a xRoute rule.
                              format: int64
                              maximum: 4294967295
                              minimum: 0
                              type: integer
                            maxParallelRetries:
                              default: 1024
                              description: The maximum number of parallel retries
                                that Envoy will make to the referenced backend defined
                                within a xRoute rule.
                              format: int64
                              maximum: 4294967295
                              minimum: 0
                              type: integer
                            maxPendingRequests:
                              default: 1024
                              description: The maximum number of pending requests
                                that Envoy will queue to the referenced backend defined
                                within a xRoute rule.
                              format: int64
                              maximum: 4294967295
                              minimum: 0
                              type: integer
                            maxRequestsPerConnection:
                              description: |-
                                The maximum number of requests that Envoy will make over a single connection to the referenced backend defined within a xRoute rule.
                                Default: unlimited.
                              format: int64
                              maximum: 4294967295
                              minimum: 0
                              type: integer
                            perEndpoint:
                              description: PerEndpoint defines Circuit Breakers that
                                will apply per-endpoint for an upstream cluster
                              properties:
                                maxConnections:
                                  default: 1024
                                  description: MaxConnections configures the maximum
                                    number of connections that Envoy will establish
                                    per-endpoint to the referenced backend defined
                                    within a xRoute rule.
                                  format: int64
                                  maximum: 4294967295
                                  minimum: 0
                                  type: integer
                              type: object
                            retryBudget:
                              description: |-
                                RetryBudget provides settings for retry budget, which limits the number of retries in a given percentage.
                                RetryBudget take precedence over maxParallelRetries.
                              properties:
                                minRetryConcurrency:
                                  description: MinRetryConcurrency specifies the minimum
                                    retry concurrency allowed for the retry budget.
                                  format: int32
                                  type: integer
                                percent:
                                  description: |-
                                    Percent specifies the limit on concurrent retries as a percentage [0, 100] of
                                    the sum of active requests and active pending requests.
                                  properties:
                                    denominator:
                                      default: 100
                                      format: int32
                                      minimum: 1
                                      type: integer
                                    numerator:
                                      format: int32
                                      minimum: 0
                                      type: integer
                                  required:
                                  - numerator
                                  type: object
                                  x-kubernetes-validations:
                                  - message: numerator must be less than or equal
                                      to denominator
                                    rule: self.numerator <= self.denominator
                              required:
                              - percent
                              type: object
                          type: object
                        connection:
                          description: Connection includes backend connection settings.
                          properties:
                            bufferLimit:
                              allOf:
                              - pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                              - pattern: ^[1-9]+[0-9]*([EPTGMK]i|[EPTGMk])?$
                              anyOf:
                              - type: integer
                              - type: string
                              description: |-
                                BufferLimit Soft limit on size of the cluster’s connections read and write buffers.
                                BufferLimit applies to connection streaming (maybe non-streaming) channel between processes, it's in user space.
                              x-kubernetes-int-or-string: true
                            preconnect:
                              description: |-
                                Preconnect configures proactive upstream connections to reduce latency by establishing
                                connections before they’re needed and avoiding connection establishment overhead.
                              properties:
                                perEndpointPercent:
                                  description: |-
                                    PerEndpointPercent configures how many additional connections to maintain per
                                    upstream endpoint, useful for high-QPS or latency sensitive services.
                                  format: int32
                                  maximum: 300
                                  minimum: 100
                                  type: integer
                                predictivePercent:
                                  description: |-
                                    PredictivePercent configures how many additional connections to maintain
                                    across the cluster by anticipating which upstream endpoint the load balancer
                                    will select next, useful for low-QPS services.
                                  format: int32
                                  minimum: 100
                                  type: integer
                              type: object
                            socketBufferLimit:
                              allOf:
                              - pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                              - pattern: ^[1-9]+[0-9]*([EPTGMK]i|[EPTGMk])?$
                              anyOf:
                              - type: integer
                              - type: string
                              description: |-
                                SocketBufferLimit provides configuration for the maximum buffer size in bytes for each socket
                                to backend.
                              x-kubernetes-int-or-string: true
                          type: object
                        dns:
                          description: DNS includes dns resolution settings.
                          properties:
                            dnsRefreshRate:
                              description: |-
                                DNSRefreshRate specifies the rate at which DNS records should be refreshed.
                                Defaults to 30 seconds.
                              pattern: ^([0-9]{1,5}(h|m|s|ms)){1,4}$
                              type: string
                            lookupFamily:
                              description: |-
                                LookupFamily determines how Envoy would resolve DNS for Routes where the backend is specified as a fully qualified domain name (FQDN).
                                If set, this configuration overrides other defaults.
                              enum:
                              - IPv4
                              - IPv6
                              - IPv4Preferred
                              - IPv6Preferred
                              - IPv4AndIPv6
                              type: string
                            respectDnsTtl:
                              description: |-
                                RespectDNSTTL indicates whether the DNS Time-To-Live (TTL) should be respected.
                                If the value is set to true, the DNS refresh rate will be set to the resource record’s TTL.
                                Defaults to true.
                              type: boolean
                          type: object
                        healthCheck:
                          description: HealthCheck allows gateway to perform active
                            health checking on backends.
                          properties:
                            active:
                              description: Active health check configuration
                              properties:
                                disableConnectionReuse:
                                  description: |-
                                    DisableConnectionReuse determines whether the active health check connection to a
                                    backend host is closed after each health check probe.
                                  type: boolean
                                grpc:
                                  description: |-
                                    GRPC defines the configuration of the GRPC health checker.
                                    It's optional, and can only be used if the specified type is GRPC.
                                  properties:
                                    hostname:
                                      description: |-
                                        Hostname defines the value of the :authority header sent with active gRPC
                                        health checks.
                                      maxLength: 253
                                      minLength: 1
                                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                                      type: string
                                    service:
                                      description: |-
                                        Service to send in the health check request.
                                        If this is not specified, then the health check request applies to the entire
                                        server and not to a specific service.
                                      type: string
                                  type: object
                                healthCheckLog:
                                  description: |-
                                    HealthCheckLog defines health check event logging configuration for this cluster.
                                    When set, HC probe outcomes are logged to the configured sinks.
                                    Takes precedence over the gateway-level EnvoyProxy.
                                  properties:
                                    matches:
                                      description: |-
                                        Matches defines which health check probe outcomes produce a log entry.
                                        When omitted or empty, all events are logged.

                                        Each value must be unique. Multiple values are ORed.
                                      items:
                                        description: ProxyHealthCheckLogEventType
                                          specifies which health check probe outcomes
                                          produce a log entry.
                                        enum:
                                        - Failure
                                        - FailureSeriesStart
                                        - Success
                                        - HealthyTransition
                                        type: string
                                      maxItems: 4
                                      type: array
                                      x-kubernetes-list-type: set
                                      x-kubernetes-validations:
                                      - message: a failure type and a success type
                                          must both be specified together
                                        rule: self.exists(e, e == 'Failure' || e ==
                                          'FailureSeriesStart') == self.exists(e,
                                          e == 'Success' || e == 'HealthyTransition')
                                    sinks:
                                      description: |-
                                        Sinks defines where health check events are written.
                                        When omitted, events are written to /dev/stdout.
                                      items:
                                        description: ProxyHealthCheckLogSink defines
                                          a destination for health check event logs.
                                        properties:
                                          file:
                                            description: |-
                                              File defines the file sink configuration.
                                              Required when type is File.
                                            properties:
                                              path:
                                                description: |-
                                                  Path specifies the file path for health check event output.
                                                  Use /dev/stdout to write to standard output.
                                                minLength: 1
                                                type: string
                                            required:
                                            - path
                                            type: object
                                          type:
                                            description: Type defines the type of
                                              sink.
                                            enum:
                                            - File
                                            type: string
                                        required:
                                        - type
                                        type: object
                                        x-kubernetes-validations:
                                        - message: If ProxyHealthCheckLogSink type
                                            is File, file field needs to be set.
                                          rule: 'self.type == ''File'' ? has(self.file)
                                            : !has(self.file)'
                                      maxItems: 1
                                      type: array
                                  type: object
                                healthyThreshold:
                                  default: 1
                                  description: HealthyThreshold defines the number
                                    of healthy health checks required before a backend
                                    host is marked healthy.
                                  format: int32
                                  minimum: 1
                                  type: integer
                                http:
                                  description: |-
                                    HTTP defines the configuration of http health checker.
                                    It's required while the health checker type is HTTP.
                                  properties:
                                    expectedResponse:
                                      description: ExpectedResponse defines a list
                                        of HTTP expected responses to match.
                                      properties:
                                        binary:
                                          description: Binary payload base64 encoded.
                                          format: byte
                                          type: string
                                        text:
                                          description: Text payload in plain text.
                                          type: string
                                        type:
                                          allOf:
                                          - enum:
                                            - Text
                                            - Binary
                                          - enum:
                                            - Text
                                            - Binary
                                          description: Type defines the type of the
                                            payload.
                                          type: string
                                      required:
                                      - type
                                      type: object
                                      x-kubernetes-validations:
                                      - message: If payload type is Text, text field
                                          needs to be set.
                                        rule: 'self.type == ''Text'' ? has(self.text)
                                          : !has(self.text)'
                                      - message: If payload type is Binary, binary
                                          field needs to be set.
                                        rule: 'self.type == ''Binary'' ? has(self.binary)
                                          : !has(self.binary)'
                                    expectedStatuses:
                                      description: |-
                                        ExpectedStatuses defines a list of HTTP response statuses considered healthy.
                                        Defaults to 200 only
                                      items:
                                        description: HTTPStatus defines the http status
                                          code.
                                        maximum: 599
                                        minimum: 100
                                        type: integer
                                      type: array
                                    hostname:
                                      description: Hostname defines the HTTP Host
                                        header used for active HTTP health checks.
                                      maxLength: 253
                                      minLength: 1
                                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                                      type: string
                                    method:
                                      description: |-
                                        Method defines the HTTP method used for health checking.
                                        Defaults to GET
                                      maxLength: 16
                                      type: string
                                    path:
                                      description: Path defines the HTTP path that
                                        will be requested during health checking.
                                      maxLength: 1024
                                      minLength: 1
                                      type: string
                                    protocol:
                                      default: Auto
                                      description: Protocol is the HTTP protocol that
                                        active health check requests are sent with.
                                      enum:
                                      - Auto
                                      - HTTP1
                                      - HTTP2
                                      type: string
                                    requestBody:
                                      description: RequestBody defines the HTTP request
                                        body payload sent during health checking.
                                      properties:
                                        binary:
                                          description: Binary payload base64 encoded.
                                          format: byte
                                          type: string
                                        text:
                                          description: Text payload in plain text.
                                          type: string
                                        type:
                                          allOf:
                                          - enum:
                                            - Text
                                            - Binary
                                          - enum:
                                            - Text
                                            - Binary
                                          description: Type defines the type of the
                                            payload.
                                          type: string
                                      required:
                                      - type
                                      type: object
                                      x-kubernetes-validations:
                                      - message: If payload type is Text, text field
                                          needs to be set.
                                        rule: 'self.type == ''Text'' ? has(self.text)
                                          : !has(self.text)'
                                      - message: If payload type is Binary, binary
                                          field needs to be set.
                                        rule: 'self.type == ''Binary'' ? has(self.binary)
                                          : !has(self.binary)'
                                    retriableStatuses:
                                      description: RetriableStatuses defines a list
                                        of HTTP response statuses considered retriable.
                                      items:
                                        description: HTTPStatus defines the http status
                                          code.
                                        maximum: 599
                                        minimum: 100
                                        type: integer
                                      type: array
                                  required:
                                  - path
                                  type: object
                                  x-kubernetes-validations:
                                  - message: The requestBody field can only be set
                                      when method is POST or PUT.
                                    rule: '!has(self.requestBody) || (has(self.method)
                                      && self.method.upperAscii() in [''POST'',''PUT''])'
                                initialJitter:
                                  description: |-
                                    InitialJitter defines the maximum time Envoy will wait before the first health check.
                                    Envoy will randomly select a value between 0 and the initial jitter value.
                                  pattern: ^([0-9]{1,5}(h|m|s|ms)){1,4}$
                                  type: string
                                interval:
                                  default: 3s
                                  description: Interval defines the time between active
                                    health checks.
                                  pattern: ^([0-9]{1,5}(h|m|s|ms)){1,4}$
                                  type: string
                                  x-kubernetes-validations:
                                  - message: interval must be greater than 0
                                    rule: duration(self) > duration('0s')
                                overrides:
                                  description: |-
                                    Overrides defines the configuration of the overriding health check settings for all endpoints
                                    in the backend cluster.
                                  properties:
                                    port:
                                      description: |-
                                        Port overrides the health check port.
                                        If not set, the endpoint's serving port is used for health checks.
                                        This is useful when health checks are served on a different port than
                                        the main service port (e.
                                      format: int32
                                      maximum: 65535
                                      minimum: 1
                                      type: integer
                                  type: object
                                tcp:
                                  description: |-
                                    TCP defines the configuration of tcp health checker.
                                    It's required while the health checker type is TCP.
                                  properties:
                                    receive:
                                      description: Receive defines the expected response
                                        payload.
                                      properties:
                                        binary:
                                          description: Binary payload base64 encoded.
                                          format: byte
                                          type: string
                                        text:
                                          description: Text payload in plain text.
                                          type: string
                                        type:
                                          allOf:
                                          - enum:
                                            - Text
                                            - Binary
                                          - enum:
                                            - Text
                                            - Binary
                                          description: Type defines the type of the
                                            payload.
                                          type: string
                                      required:
                                      - type
                                      type: object
                                      x-kubernetes-validations:
                                      - message: If payload type is Text, text field
                                          needs to be set.
                                        rule: 'self.type == ''Text'' ? has(self.text)
                                          : !has(self.text)'
                                      - message: If payload type is Binary, binary
                                          field needs to be set.
                                        rule: 'self.type == ''Binary'' ? has(self.binary)
                                          : !has(self.binary)'
                                    send:
                                      description: Send defines the request payload.
                                      properties:
                                        binary:
                                          description: Binary payload base64 encoded.
                                          format: byte
                                          type: string
                                        text:
                                          description: Text payload in plain text.
                                          type: string
                                        type:
                                          allOf:
                                          - enum:
                                            - Text
                                            - Binary
                                          - enum:
                                            - Text
                                            - Binary
                                          description: Type defines the type of the
                                            payload.
                                          type: string
                                      required:
                                      - type
                                      type: object
                                      x-kubernetes-validations:
                                      - message: If payload type is Text, text field
                                          needs to be set.
                                        rule: 'self.type == ''Text'' ? has(self.text)
                                          : !has(self.text)'
                                      - message: If payload type is Binary, binary
                                          field needs to be set.
                                        rule: 'self.type == ''Binary'' ? has(self.binary)
                                          : !has(self.binary)'
                                  type: object
                                timeout:
                                  default: 1s
                                  description: Timeout defines the time to wait for
                                    a health check response.
                                  pattern: ^([0-9]{1,5}(h|m|s|ms)){1,4}$
                                  type: string
                                  x-kubernetes-validations:
                                  - message: timeout must be greater than 0
                                    rule: duration(self) > duration('0s')
                                type:
                                  allOf:
                                  - enum:
                                    - HTTP
                                    - TCP
                                    - GRPC
                                  - enum:
                                    - HTTP
                                    - TCP
                                    - GRPC
                                  description: Type defines the type of health checker.
                                  type: string
                                unhealthyThreshold:
                                  default: 3
                                  description: UnhealthyThreshold defines the number
                                    of unhealthy health checks required before a backend
                                    host is marked unhealthy.
                                  format: int32
                                  minimum: 1
                                  type: integer
                              required:
                              - type
                              type: object
                              x-kubernetes-validations:
                              - message: If Health Checker type is HTTP, http field
                                  needs to be set.
                                rule: 'self.type == ''HTTP'' ? has(self.http) : !has(self.http)'
                              - message: If Health Checker type is TCP, tcp field
                                  needs to be set.
                                rule: 'self.type == ''TCP'' ? has(self.tcp) : !has(self.tcp)'
                              - message: The grpc field can only be set if the Health
                                  Checker type is GRPC.
                                rule: 'has(self.grpc) ? self.type == ''GRPC'' : true'
                            panicThreshold:
                              description: |-
                                When number of unhealthy endpoints for a backend reaches this threshold
                                Envoy will disregard health status and balance across all endpoints.
                              format: int32
                              maximum: 100
                              minimum: 0
                              type: integer
                            passive:
                              description: Passive passive check configuration
                              properties:
                                alwaysEjectOneEndpoint:
                                  default: false
                                  description: |-
                                    AlwaysEjectOneEndpoint defines whether at least one host should be ejected,
                                    regardless of MaxEjectionPercent.
                                  type: boolean
                                baseEjectionTime:
                                  default: 30s
                                  description: BaseEjectionTime defines the base duration
                                    for which a host will be ejected on consecutive
                                    failures.
                                  pattern: ^([0-9]{1,5}(h|m|s|ms)){1,4}$
                                  type: string
                                  x-kubernetes-validations:
                                  - message: baseEjectionTime must be greater than
                                      0
                                    rule: duration(self) > duration('0s')
                                consecutive5XxErrors:
                                  default: 5
                                  description: Consecutive5xxErrors sets the number
                                    of consecutive 5xx errors triggering ejection.
                                  format: int32
                                  type: integer
                                consecutiveGatewayErrors:
                                  description: ConsecutiveGatewayErrors sets the number
                                    of consecutive gateway errors triggering ejection.
                                  format: int32
                                  type: integer
                                consecutiveLocalOriginFailures:
                                  default: 5
                                  description: |-
                                    ConsecutiveLocalOriginFailures sets the number of consecutive local origin failures triggering ejection.
                                    Parameter takes effect only when split_external_local_origin_errors is set to true.
                                  format: int32
                                  type: integer
                                failurePercentageThreshold:
                                  description: |-
                                    FailurePercentageThreshold sets the failure percentage threshold for outlier detection.
                                    If the failure percentage of a given host is greater than or equal to this value, it will be ejected.
                                  format: int32
                                  maximum: 100
                                  minimum: 0
                                  type: integer
                                interval:
                                  default: 3s
                                  description: Interval defines the time between passive
                                    health checks.
                                  pattern: ^([0-9]{1,5}(h|m|s|ms)){1,4}$
                                  type: string
                                  x-kubernetes-validations:
                                  - message: interval must be greater than 0
                                    rule: duration(self) > duration('0s')
                                maxEjectionPercent:
                                  default: 10
                                  description: MaxEjectionPercent sets the maximum
                                    percentage of hosts in a cluster that can be ejected.
                                  format: int32
                                  maximum: 100
                                  minimum: 0
                                  type: integer
                                splitExternalLocalOriginErrors:
                                  default: false
                                  description: SplitExternalLocalOriginErrors enables
                                    splitting of errors between external and local
                                    origin.
                                  type: boolean
                              type: object
                          type: object
                        http1:
                          description: HTTP1 provides HTTP/1 configuration for backend
                            connections.
                          properties:
                            enableTrailers:
                              description: EnableTrailers defines if HTTP/1 trailers
                                should be proxied by Envoy.
                              type: boolean
                            preserveHeaderCase:
                              description: |-
                                PreserveHeaderCase defines if Envoy should preserve the letter case of headers.
                                By default, Envoy will lowercase all the headers.
                              type: boolean
                          type: object
                        http2:
                          description: HTTP2 provides HTTP/2 configuration for backend
                            connections.
                          properties:
                            connectionKeepalive:
                              description: ConnectionKeepalive configures HTTP/2 connection
                                keepalive using PING frames.
                              properties:
                                idleInterval:
                                  description: IdleInterval specifies how long a connection
                                    must be idle before a PING is sent.
                                  pattern: ^([0-9]{1,5}(h|m|s|ms)){1,4}$
