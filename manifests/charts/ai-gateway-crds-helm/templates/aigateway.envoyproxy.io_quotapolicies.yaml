---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  labels:
    gateway.networking.k8s.io/policy: direct
  name: quotapolicies.aigateway.envoyproxy.io
spec:
  group: aigateway.envoyproxy.io
  names:
    kind: QuotaPolicy
    listKind: QuotaPolicyList
    plural: quotapolicies
    singular: quotapolicy
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[-1:].type
      name: Status
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            properties:
              perModelQuotas:
                items:
                  properties:
                    modelName:
                      minLength: 1
                      type: string
                    quota:
                      properties:
                        bucketRules:
                          items:
                            properties:
                              clientSelectors:
                                items:
                                  properties:
                                    headers:
                                      items:
                                        properties:
                                          invert:
                                            default: false
                                            type: boolean
                                          name:
                                            maxLength: 256
                                            minLength: 1
                                            type: string
                                          type:
                                            default: Exact
                                            enum:
                                            - Exact
                                            - RegularExpression
                                            - Distinct
                                            type: string
                                          value:
                                            maxLength: 1024
                                            type: string
                                        required:
                                        - name
                                        type: object
                                      maxItems: 128
                                      type: array
                                    methods:
                                      items:
                                        properties:
                                          invert:
                                            default: false
                                            type: boolean
                                          value:
                                            enum:
                                            - GET
                                            - HEAD
                                            - POST
                                            - PUT
                                            - DELETE
                                            - CONNECT
                                            - OPTIONS
                                            - TRACE
                                            - PATCH
                                            type: string
                                        required:
                                        - value
                                        type: object
                                      type: array
                                    path:
                                      properties:
                                        invert:
                                          default: false
                                          type: boolean
                                        type:
                                          default: PathPrefix
                                          enum:
                                          - Exact
                                          - PathPrefix
                                          - RegularExpression
                                          type: string
                                        value:
                                          default: /
                                          maxLength: 1024
                                          type: string
                                      required:
                                      - value
                                      type: object
                                    queryParams:
                                      items:
                                        properties:
                                          invert:
                                            default: false
                                            type: boolean
                                          name:
                                            maxLength: 256
                                            minLength: 1
                                            type: string
                                          type:
                                            default: Exact
                                            enum:
                                            - Exact
                                            - RegularExpression
                                            - Distinct
                                            type: string
                                          value:
                                            maxLength: 1024
                                            type: string
                                        required:
                                        - name
                                        type: object
                                      maxItems: 16
                                      type: array
                                    sourceCIDR:
                                      properties:
                                        invert:
                                          default: false
                                          type: boolean
                                        type:
                                          default: Exact
                                          enum:
                                          - Exact
                                          - Distinct
                                          type: string
                                        value:
                                          maxLength: 256
                                          minLength: 1
                                          type: string
                                      required:
                                      - value
                                      type: object
                                  type: object
                                  x-kubernetes-validations:
                                  - message: at least one of headers, methods, path,
                                      sourceCIDR or queryParams must be specified
                                    rule: has(self.headers) || has(self.methods) ||
                                      has(self.path) || has(self.sourceCIDR) || has(self.queryParams)
                                maxItems: 8
                                type: array
                              quota:
                                properties:
                                  duration:
                                    enum:
                                    - 1s
                                    - 1m
                                    - 1h
                                    - 1d
                                    - 1w
                                    - 1mo
                                    - 1y
                                    type: string
                                  fromMetadata:
                                    properties:
                                      key:
                                        maxLength: 256
                                        minLength: 1
                                        pattern: ^[A-Za-z0-9._:-]+$
                                        type: string
                                      namespace:
                                        maxLength: 256
                                        minLength: 1
                                        pattern: ^[A-Za-z0-9._:-]+$
                                        type: string
                                    required:
                                    - key
                                    - namespace
                                    type: object
                                  limit:
                                    type: integer
                                required:
                                - duration
                                - limit
                                type: object
                              shadowMode:
                                type: boolean
                            required:
                            - quota
                            type: object
                          type: array
                        costExpression:
                          type: string
                        defaultBucket:
                          properties:
                            duration:
                              enum:
                              - 1s
                              - 1m
                              - 1h
                              - 1d
                              - 1w
                              - 1mo
                              - 1y
                              type: string
                            fromMetadata:
                              properties:
                                key:
                                  maxLength: 256
                                  minLength: 1
                                  pattern: ^[A-Za-z0-9._:-]+$
                                  type: string
                                namespace:
                                  maxLength: 256
                                  minLength: 1
                                  pattern: ^[A-Za-z0-9._:-]+$
                                  type: string
                              required:
                              - key
                              - namespace
                              type: object
                            limit:
                              type: integer
                          required:
                          - duration
                          - limit
                          type: object
                        mode:
                          default: Shared
                          enum:
                          - Shared
                          type: string
                      type: object
                  required:
                  - modelName
                  - quota
                  type: object
                maxItems: 128
                type: array
              serviceQuota:
                properties:
                  costExpression:
                    type: string
                  quota:
                    properties:
                      duration:
                        enum:
                        - 1s
                        - 1m
                        - 1h
                        - 1d
                        - 1w
                        - 1mo
                        - 1y
                        type: string
                      fromMetadata:
                        properties:
                          key:
                            maxLength: 256
                            minLength: 1
                            pattern: ^[A-Za-z0-9._:-]+$
                            type: string
                          namespace:
                            maxLength: 256
                            minLength: 1
                            pattern: ^[A-Za-z0-9._:-]+$
                            type: string
                        required:
                        - key
                        - namespace
                        type: object
                      limit:
                        type: integer
                    required:
                    - duration
                    - limit
                    type: object
                required:
                - quota
                type: object
              targetRefs:
                items:
                  properties:
                    group:
                      maxLength: 253
                      pattern: ^$|^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                      type: string
                    kind:
                      maxLength: 63
                      minLength: 1
                      pattern: ^[a-zA-Z]([-a-zA-Z0-9]*[a-zA-Z0-9])?$
                      type: string
                    name:
                      maxLength: 253
                      minLength: 1
                      type: string
                    namespace:
                      maxLength: 63
                      minLength: 1
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                  required:
                  - group
                  - kind
                  - name
                  type: object
                maxItems: 16
                type: array
                x-kubernetes-validations:
                - message: targetRefs must reference AIServiceBackend resources
                  rule: self.all(ref, ref.group == 'aigateway.envoyproxy.io' && ref.kind
                    == 'AIServiceBackend')
            type: object
          status:
            properties:
              conditions:
                items:
                  properties:
                    lastTransitionTime:
                      format: date-time
                      type: string
                    message:
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
