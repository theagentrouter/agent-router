                    rule: '!has(self.backendRefs) || size(self.backendRefs) == 0 ||
                      (self.backendRefs.all(ref, !has(ref.group) && !has(ref.kind))
                      || self.backendRefs.all(ref, has(ref.group) && has(ref.kind)))'
                  - message: only one InferencePool backend is allowed per rule
                    rule: '!has(self.backendRefs) || size(self.backendRefs) == 0 ||
