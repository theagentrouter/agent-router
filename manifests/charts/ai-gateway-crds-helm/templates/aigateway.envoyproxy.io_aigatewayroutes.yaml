                items:
                  properties:
                    backendRefs:
                      items:
                        properties:
                          bodyMutation:
                            properties:
                              remove:
                                items:
                                  type: string
                                maxItems: 16
                                type: array
                                x-kubernetes-list-type: set
                              set:
                                items:
                                  properties:
                                    path:
                                      minLength: 1
                                      type: string
                                    value:
                                      type: string
                                  required:
                                  - path
                                  - value
                                  type: object
                                maxItems: 16
                                type: array
                                x-kubernetes-list-map-keys:
                                - path
                                x-kubernetes-list-type: map
                            type: object
                          group:
