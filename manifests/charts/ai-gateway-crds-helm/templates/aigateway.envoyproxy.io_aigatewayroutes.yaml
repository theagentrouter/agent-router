                      || size(self.backendRefs) == 1'
                maxItems: 15
                type: array
                x-kubernetes-validations:
                - message: rule name must be unique within the route
                  rule: self.all(r1, !has(r1.name) || self.exists_one(r2, has(r2.name)
                    && r1.name == r2.name))
