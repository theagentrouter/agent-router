  names:
    kind: AIServiceBackend
    listKind: AIServiceBackendList
    plural: aiservicebackends
    singular: aiservicebackend
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[-1:].type
      name: Status
      type: string
    deprecated: true
    deprecationWarning: aigateway.envoyproxy.io/v1alpha1 is deprecated; use aigateway.envoyproxy.io/v1beta1
      instead
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            properties:
              backendRef:
                properties:
                  group:
                    default: ""
                    maxLength: 253
                    pattern: ^$|^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                  kind:
                    default: Service
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-zA-Z]([-a-zA-Z0-9]*[a-zA-Z0-9])?$
                    type: string
                  name:
                    maxLength: 253
                    minLength: 1
                    type: string
                  namespace:
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                  port:
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                required:
                - name
                type: object
                x-kubernetes-validations:
                - message: BackendRef must be a Backend resource of Envoy Gateway.
                    See https://github.com/envoyproxy/ai-gateway/issues/902 for more
                    details.
                  rule: has(self.kind) && self.kind == 'Backend' && has(self.group)
                    && self.group == 'gateway.envoyproxy.io'
                - message: Must have port for Service reference
                  rule: '(size(self.group) == 0 && self.kind == ''Service'') ? has(self.port)
                    : true'
              bodyMutation:
                properties:
                  remove:
                    items:
                      type: string
                    maxItems: 16
                    type: array
                    x-kubernetes-list-type: set
                  set:
                    items:
                      properties:
                        path:
                          minLength: 1
                          type: string
                        value:
                          type: string
                      required:
                      - path
                      - value
                      type: object
                    maxItems: 16
                    type: array
                    x-kubernetes-list-map-keys:
                    - path
                    x-kubernetes-list-type: map
                type: object
              headerMutation:
                properties:
                  remove:
                    items:
                      type: string
                    maxItems: 16
                    type: array
                    x-kubernetes-list-type: set
                  set:
                    items:
                      properties:
                        name:
                          maxLength: 256
                          minLength: 1
                          pattern: ^[A-Za-z0-9!#$%&'*+\-.^_\x60|~]+$
                          type: string
                        value:
                          maxLength: 4096
                          minLength: 1
                          type: string
                      required:
                      - name
                      - value
                      type: object
                    maxItems: 16
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                type: object
              schema:
                properties:
                  name:
                    enum:
                    - OpenAI
                    - Cohere
                    - AWSBedrock
                    - AzureOpenAI
                    - GCPVertexAI
                    - GCPAnthropic
                    - Anthropic
                    - AWSAnthropic
                    - AWSOpenAI
                    - TypeSafe
                    type: string
                  prefix:
                    type: string
                  version:
                    type: string
                required:
                - name
                type: object
            required:
            - backendRef
            - schema
            type: object
          status:
            properties:
              conditions:
                items:
                  properties:
                    lastTransitionTime:
                      format: date-time
                      type: string
                    message:
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
            type: object
        type: object
    served: true
    storage: false
    subresources:
      status: {}
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[-1:].type
      name: Status
      type: string
    name: v1beta1
