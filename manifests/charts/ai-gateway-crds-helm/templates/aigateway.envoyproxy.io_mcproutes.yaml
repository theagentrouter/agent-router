---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: mcproutes.aigateway.envoyproxy.io
spec:
  group: aigateway.envoyproxy.io
  names:
    kind: MCPRoute
    listKind: MCPRouteList
    plural: mcproutes
    singular: mcproute
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[-1:].type
      name: Status
      type: string
    deprecated: true
    deprecationWarning: aigateway.envoyproxy.io/v1alpha1 is deprecated; use aigateway.envoyproxy.io/v1beta1
      instead
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          MCPRoute defines how to route MCP requests to the backend MCP servers.

          This serves as a way to define a "unified" AI API for a Gateway which allows downstream
          clients to use a single schema API to interact with multiple MCP backends.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: Spec defines the details of the MCPRoute.
            properties:
              backendRefs:
                description: |-
                  BackendRefs is a list of backend references to the MCP servers.
                  These MCP servers will be aggregated and exposed as a single MCP endpoint to the clients.
                  From the client's perspective, they only need to configure a single MCP server URL, e.g. "https://api.example.com/mcp",
                  and the Envoy AI Gateway will route the requests to the appropriate MCP server based on the requests.

                  All names must be unique within this list to avoid potential tools, resources, etc. name collisions.
                  Also, cross-namespace references are not supported. In other words, the backend MCP servers must be in the
                  same namespace as the MCPRoute.
                items:
                  description: MCPRouteBackendRef wraps a EG's BackendObjectReference
                    to reference an MCP server.
                  properties:
                    forwardHeaders:
                      description: |-
                        ForwardHeaders specifies HTTP headers to extract from the incoming client request
                        and forward to this backend MCP server.
                        This enables per-user authentication passthrough (e.g., personal access tokens)
                        without requiring OAuth configuration.
                        Each entry specifies a header name to extract and an optional rename for the backend.
                      items:
                        description: MCPHeaderForward specifies a header to extract
                          from the incoming request and forward to a backend.
                        properties:
                          backendHeader:
                            description: |-
                              BackendHeader is the header name to use when forwarding to the backend.
                              If not specified, the original header name is used.
                            minLength: 1
                            type: string
                          name:
                            description: Name is the header name to extract from the
                              incoming client request.
                            minLength: 1
                            type: string
                        required:
                        - name
                        type: object
                      maxItems: 32
                      type: array
                    group:
                      default: ""
                      description: |-
                        Group is the group of the referent. For example, "gateway.networking.k8s.io".
                        When unspecified or empty string, core API group is inferred.
                      maxLength: 253
                      pattern: ^$|^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                      type: string
                    kind:
                      default: Service
                      description: |-
                        Kind is the Kubernetes resource kind of the referent. For example
                        "Service".

                        Defaults to "Service" when not specified.

                        ExternalName services can refer to CNAME DNS records that may live
                        outside of the cluster and as such are difficult to reason about in
                        terms of conformance. They also may not be safe to forward to (see
                        CVE-2021-25740 for more information). Implementations SHOULD NOT
                        support ExternalName Services.

                        Support: Core (Services with a type other than ExternalName)

                        Support: Implementation-specific (Services with type ExternalName)
                      maxLength: 63
                      minLength: 1
                      pattern: ^[a-zA-Z]([-a-zA-Z0-9]*[a-zA-Z0-9])?$
                      type: string
                    name:
                      description: Name is the name of the referent.
                      maxLength: 253
                      minLength: 1
                      type: string
                    namespace:
                      description: |-
                        Namespace is the namespace of the backend. When unspecified, the local
                        namespace is inferred.

                        Note that when a namespace different than the local namespace is specified,
                        a ReferenceGrant object is required in the referent namespace to allow that
                        namespace's owner to accept the reference. See the ReferenceGrant
                        documentation for details.

                        Support: Core
                      maxLength: 63
                      minLength: 1
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    path:
                      default: /mcp
                      description: |-
                        Path is the HTTP endpoint path of the backend MCP server.
                        If not specified, the default is "/mcp".
                      maxLength: 1024
                      type: string
                    port:
                      description: |-
                        Port specifies the destination port number to use for this resource.
                        Port is required when the referent is a Kubernetes Service. In this
                        case, the port number is the service port number, not the target port.
                        For other resources, destination port might be derived from the referent
                        resource or this field.
                      format: int32
                      maximum: 65535
                      minimum: 1
                      type: integer
                    securityPolicy:
                      description: SecurityPolicy is the security policy to apply
                        to this MCP server.
                      properties:
                        apiKey:
                          description: APIKey is a mechanism to access a backend.
                            The API key will be injected into the request headers.
                          properties:
                            header:
                              description: |-
                                Header is the HTTP header to inject the API key into. If not specified,
                                defaults to "Authorization".
                                When the header is "Authorization", the injected header value will be
                                prefixed with "Bearer ".

                                Either one of Header or QueryParam can be specified to inject the API key.
                              minLength: 1
                              type: string
                            inline:
                              description: Inline contains the API key as an inline
                                string.
                              type: string
                            queryParam:
                              description: |-
                                QueryParam is the HTTP query parameter to inject the API key into.
                                For example, if QueryParam is set to "api_key", and the API key is "mysecretkey", the request URL will be modified to include
                                "?api_key=mysecretkey".

                                Either one of Header or QueryParam can be specified to inject the API key.
                              minLength: 1
                              type: string
                            secretRef:
                              description: |-
                                secretRef is the Kubernetes secret which contains the API keys.
                                The key of the secret should be "apiKey".
                              properties:
                                group:
                                  default: ""
                                  description: |-
                                    Group is the group of the referent. For example, "gateway.networking.k8s.io".
                                    When unspecified or empty string, core API group is inferred.
                                  maxLength: 253
                                  pattern: ^$|^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                                  type: string
                                kind:
                                  default: Secret
                                  description: Kind is kind of the referent. For example
                                    "Secret".
                                  maxLength: 63
                                  minLength: 1
                                  pattern: ^[a-zA-Z]([-a-zA-Z0-9]*[a-zA-Z0-9])?$
                                  type: string
                                name:
                                  description: Name is the name of the referent.
                                  maxLength: 253
                                  minLength: 1
                                  type: string
                                namespace:
                                  description: |-
                                    Namespace is the namespace of the referenced object. When unspecified, the local
                                    namespace is inferred.

                                    Note that when a namespace different than the local namespace is specified,
                                    a ReferenceGrant object is required in the referent namespace to allow that
                                    namespace's owner to accept the reference. See the ReferenceGrant
                                    documentation for details.

                                    Support: Core
                                  maxLength: 63
                                  minLength: 1
                                  pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                                  type: string
                              required:
                              - name
                              type: object
                          type: object
                          x-kubernetes-validations:
                          - message: exactly one of secretRef or inline must be set
                            rule: (has(self.secretRef) && !has(self.inline)) || (!has(self.secretRef)
                              && has(self.inline))
                          - message: only one of header or queryParam can be set
                            rule: '!(has(self.header) && has(self.queryParam))'
                      type: object
                    toolSelector:
                      description: |-
                        ToolSelector filters the tools exposed by this MCP server.
                        Supports exact matches and RE2-compatible regular expressions for both include and exclude patterns.
                        If not specified, all tools from the MCP server are exposed.
                      properties:
                        exclude:
                          description: |-
                            Exclude is a list of tool names to exclude. The specified tools will not be available.
                            Exclude rules take precedence over include rules.
                          items:
                            type: string
                          maxItems: 32
                          type: array
                        excludeRegex:
                          description: |-
                            ExcludeRegex is a list of RE2-compatible regular expressions that, when matched, exclude the tool.
                            Tools matching these patterns will not be available. Exclude rules take precedence over include rules.
                          items:
                            type: string
                          maxItems: 32
                          type: array
                        include:
                          description: Include is a list of tool names to include.
                            Only the specified tools will be available.
                          items:
                            type: string
                          maxItems: 32
                          type: array
                        includeRegex:
                          description: |-
                            IncludeRegex is a list of RE2-compatible regular expressions that, when matched, include the tool.
                            Only tools matching these patterns will be available.
                          items:
                            type: string
                          maxItems: 32
                          type: array
                      type: object
                      x-kubernetes-validations:
                      - message: include and includeRegex are mutually exclusive
                        rule: '!(has(self.include) && has(self.includeRegex))'
                      - message: exclude and excludeRegex are mutually exclusive
                        rule: '!(has(self.exclude) && has(self.excludeRegex))'
                      - message: at least one of include, includeRegex, exclude, or
                          excludeRegex must be specified
                        rule: has(self.include) || has(self.includeRegex) || has(self.exclude)
                          || has(self.excludeRegex)
                  required:
                  - name
                  type: object
                  x-kubernetes-validations:
                  - message: Must have port for Service reference
                    rule: '(size(self.group) == 0 && self.kind == ''Service'') ? has(self.port)
                      : true'
                maxItems: 256
                minItems: 1
                type: array
                x-kubernetes-validations:
                - message: all backendRefs names must be unique
                  rule: self.all(i, self.exists_one(j, j.name == i.name))
              backendSelector:
                description: |-
                  BackendSelector restricts which of this route's backends a given request may fan
                  out to, evaluated once per candidate backend when a client session is initialized.
                  If unspecified, all backends on the route are considered.
                properties:
                  defaultAction:
                    default: Deny
                    description: DefaultAction is the action to take when no rules
                      match. If unspecified, defaults to Deny.
                    enum:
                    - Allow
                    - Deny
                    type: string
                  rules:
                    description: |-
                      Rules defines a list of backend selection rules.
                      These rules are evaluated in order, the first matching rule will be applied,
                      and the rest will be skipped.

                      If no rules are defined, DefaultAction is applied to every candidate backend
                      (defaults to Deny).
                    items:
                      description: MCPBackendSelectorRule defines a single backend
                        selection rule.
                      properties:
                        action:
                          default: Allow
                          description: Action is the decision for matching backends.
                            If unspecified, defaults to Allow.
                          enum:
                          - Allow
                          - Deny
                          type: string
                        cel:
                          description: "CEL specifies a Common Expression Language
                            (CEL) expression, evaluated once for\neach backend already
                            listed in backendRefs. It does not parse a list of backends\nout
                            of the request. Each evaluation binds request.mcp.backend
                            to the name of the\none candidate backend under test,
                            so the expression should answer \"is this backend\nallowed\",
                            not \"which backends should be used\". The expression
                            must return a\nboolean; evaluation errors or non-boolean
                            results are treated as \"no match\". A\nmatch means the
                            rule applies, and Action below decides whether that's
                            an Allow or\na Deny for that backend.\n\nExample CEL expressions:\n\t*
                            `request.mcp.backend in request.auth.jwt.claims.mcp_backends`\n\t*
                            `(\",\" + request.headers[\"x-ai-eg-mcp-backend-subset\"]
                            + \",\").contains(\",\" + request.mcp.backend + \",\")`\n\nAvailable
                            attributes are the same as documented on MCPRouteAuthorizationRule.CEL,\nexcept
                            request.mcp.method, request.mcp.tool, and request.mcp.params
                            are not\npopulated (no MCP method has been selected yet
                            at backend-selection time).\n\nNote: The CEL expression
                            support is experimental, and the attributes\navailable
                            to the expression may change in future releases."
                          maxLength: 4096
                          type: string
                      type: object
                    maxItems: 32
                    type: array
                type: object
              backendTrafficPolicy:
                description: |-
                  BackendTrafficPolicy configures the auto-generated Envoy Gateway BackendTrafficPolicy
                  resources for this MCPRoute, for example the OAuth protected resource metadata policy
                  created when SecurityPolicy.OAuth is configured.
                properties:
                  mergeType:
                    description: |-
                      MergeType determines how the auto-generated BackendTrafficPolicy (for example, the
                      OAuth protected resource metadata policy) is merged with other BackendTrafficPolicy
                      configurations targeting the same route or a parent Gateway/Listener.

                      When set, the auto-generated BackendTrafficPolicy will merge with the closest parent
                      BackendTrafficPolicy in the route's attachment hierarchy instead of overriding it
                      entirely, per Envoy Gateway's merge semantics.

                      If unset, no merging occurs, and the auto-generated BackendTrafficPolicy fully
                      overrides any other BackendTrafficPolicy targeting the same route.

                      See: https://gateway.envoyproxy.io/docs/tasks/traffic/backend-traffic-policy/
                    type: string
                    x-kubernetes-validations:
                    - message: Replace is not a valid MergeType for BackendTrafficPolicy
                      rule: self != 'Replace'
                type: object
              headers:
                description: |-
                  Headers are HTTP headers that must match for this route to be selected.
                  Multiple match values are ANDed together, meaning, a request must match all the specified headers to select the route.
                items:
                  description: |-
                    HTTPHeaderMatch describes how to select a HTTP route by matching HTTP request
                    headers.
                  properties:
                    name:
                      description: |-
                        Name is the name of the HTTP Header to be matched. Name matching MUST be
                        case-insensitive. (See https://tools.ietf.org/html/rfc7230#section-3.2).

                        If multiple entries specify equivalent header names, only the first
                        entry with an equivalent name MUST be considered for a match. Subsequent
                        entries with an equivalent header name MUST be ignored. Due to the
                        case-insensitivity of header names, "foo" and "Foo" are considered
                        equivalent.

                        When a header is repeated in an HTTP request, it is
                        implementation-specific behavior as to how this is represented.
                        Generally, proxies should follow the guidance from the RFC:
                        https://www.rfc-editor.org/rfc/rfc7230.html#section-3.2.2 regarding
                        processing a repeated header, with special handling for "Set-Cookie".
                      maxLength: 256
                      minLength: 1
                      pattern: ^[A-Za-z0-9!#$%&'*+\-.^_\x60|~]+$
                      type: string
                    type:
                      default: Exact
                      description: |-
                        Type specifies how to match against the value of the header.

                        Support: Core (Exact)

                        Support: Implementation-specific (RegularExpression)

                        Since RegularExpression HeaderMatchType has implementation-specific
                        conformance, implementations can support POSIX, PCRE or any other dialects
                        of regular expressions. Please read the implementation's documentation to
                        determine the supported dialect.
                      enum:
                      - Exact
                      - RegularExpression
                      type: string
                    value:
                      description: |-
                        Value is the value of HTTP Header to be matched.
                        <gateway:experimental:description>
                        Must consist of printable US-ASCII characters, optionally separated
                        by single tabs or spaces. See: https://tools.ietf.org/html/rfc7230#section-3.2
                        </gateway:experimental:description>

                        <gateway:experimental:validation:Pattern=`^[!-~]+([\t ]?[!-~]+)*$`>
                      maxLength: 4096
                      minLength: 1
                      type: string
                  required:
                  - name
                  - value
                  type: object
                maxItems: 16
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              hostnames:
                description: |-
                  Hostnames is a list of hostnames matched against the HTTP Host header to select this MCPRoute.
                  This is equivalent to the Hostnames field in the Gateway API HTTPRouteSpec. When specified, the
                  generated HTTPRoute includes these hostnames, so the MCP route lands in the per-host virtual host
                  instead of the wildcard vhost (the same scoping AIGatewayRoute.Hostnames provides).
                  See https://gateway-api.sigs.k8s.io/reference/api-types/httproute/#hostnames
                  for the details of the Hostnames field in the Gateway API.
                items:
                  description: |-
                    Hostname is the fully qualified domain name of a network host. This matches
                    the RFC 1123 definition of a hostname with 2 notable exceptions:

                     1. IPs are not allowed.
                     2. A hostname may be prefixed with a wildcard label (`*.`). The wildcard
                        label must appear by itself as the first label.

                    Hostname can be "precise" which is a domain name without the terminating
                    dot of a network host (e.g. "foo.example.com") or "wildcard", which is a
                    domain name prefixed with a single wildcard label (e.g. `*.example.com`).

                    Note that as per RFC1035 and RFC1123, a *label* must consist of lower case
                    alphanumeric characters or '-', and must start and end with an alphanumeric
                    character. No other punctuation is allowed.
                  maxLength: 253
                  minLength: 1
                  pattern: ^(\*\.)?[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                  type: string
                maxItems: 16
                type: array
              parentRefs:
                description: |-
                  ParentRefs are the names of the Gateway resources this MCPRoute is being attached to.
                  Cross namespace references are not supported. In other words, the Gateway resources must be in the
                  same namespace as the MCPRoute. Currently, each reference's Kind must be Gateway.
                items:
                  description: |-
                    ParentReference identifies an API object (usually a Gateway) that can be considered
                    a parent of this resource (usually a route). There are two kinds of parent resources
                    with "Core" support:

                    * Gateway (Gateway conformance profile)
                    * Service (Mesh conformance profile, ClusterIP Services only)

                    This API may be extended in the future to support additional kinds of parent
                    resources.

                    The API object must be valid in the cluster; the Group and Kind must
                    be registered in the cluster for this reference to be valid.
                  properties:
                    group:
                      default: gateway.networking.k8s.io
                      description: |-
                        Group is the group of the referent.
                        When unspecified, "gateway.networking.k8s.io" is inferred.
                        To set the core API group (such as for a "Service" kind referent),
                        Group must be explicitly set to "" (empty string).

                        Support: Core
                      maxLength: 253
                      pattern: ^$|^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                      type: string
                    kind:
                      default: Gateway
                      description: |-
                        Kind is kind of the referent.

                        There are two kinds of parent resources with "Core" support:

                        * Gateway (Gateway conformance profile)
                        * Service (Mesh conformance profile, ClusterIP Services only)

                        Support for other resources is Implementation-Specific.
                      maxLength: 63
                      minLength: 1
                      pattern: ^[a-zA-Z]([-a-zA-Z0-9]*[a-zA-Z0-9])?$
                      type: string
                    name:
                      description: |-
                        Name is the name of the referent.

                        Support: Core
                      maxLength: 253
                      minLength: 1
                      type: string
                    namespace:
                      description: |-
                        Namespace is the namespace of the referent. When unspecified, this refers
                        to the local namespace of the Route.

                        Note that there are specific rules for ParentRefs which cross namespace
                        boundaries. Cross-namespace references are only valid if they are explicitly
                        allowed by something in the namespace they are referring to. For example:
                        Gateway has the AllowedRoutes field, and ReferenceGrant provides a
                        generic way to enable any other kind of cross-namespace reference.

                        <gateway:experimental:description>
                        ParentRefs from a Route to a Service in the same namespace are "producer"
                        routes, which apply default routing rules to inbound connections from
                        any namespace to the Service.

                        ParentRefs from a Route to a Service in a different namespace are
                        "consumer" routes, and these routing rules are only applied to outbound
                        connections originating from the same namespace as the Route, for which
                        the intended destination of the connections are a Service targeted as a
                        ParentRef of the Route.
                        </gateway:experimental:description>

                        Support: Core
                      maxLength: 63
                      minLength: 1
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    port:
                      description: |-
                        Port is the network port this Route targets. It can be interpreted
                        differently based on the type of parent resource.

                        When the parent resource is a Gateway, this targets all listeners
                        listening on the specified port that also support this kind of Route(and
                        select this Route). It's not recommended to set `Port` unless the
                        networking behaviors specified in a Route must apply to a specific port
                        as opposed to a listener(s) whose port(s) may be changed. When both Port
                        and SectionName are specified, the name and port of the selected listener
                        must match both specified values.

                        <gateway:experimental:description>
                        When the parent resource is a Service, this targets a specific port in the
                        Service spec. When both Port (experimental) and SectionName are specified,
                        the name and port of the selected port must match both specified values.
                        </gateway:experimental:description>

                        Implementations MAY choose to support other parent resources.
                        Implementations supporting other types of parent resources MUST clearly
                        document how/if Port is interpreted.

                        For the purpose of status, an attachment is considered successful as
                        long as the parent resource accepts it partially. For example, Gateway
                        listeners can restrict which Routes can attach to them by Route kind,
                        namespace, or hostname. If 1 of 2 Gateway listeners accept attachment
                        from the referencing Route, the Route MUST be considered successfully
                        attached. If no Gateway listeners accept attachment from this Route,
                        the Route MUST be considered detached from the Gateway.

                        Support: Extended
                      format: int32
                      maximum: 65535
                      minimum: 1
                      type: integer
                    sectionName:
                      description: |-
                        SectionName is the name of a section within the target resource. In the
                        following resources, SectionName is interpreted as the following:

                        * Gateway: Listener name. When both Port (experimental) and SectionName
                        are specified, the name and port of the selected listener must match
                        both specified values.
                        * Service: Port name. When both Port (experimental) and SectionName
                        are specified, the name and port of the selected listener must match
                        both specified values.

                        Implementations MAY choose to support attaching Routes to other resources.
                        If that is the case, they MUST clearly document how SectionName is
                        interpreted.

                        When unspecified (empty string), this will reference the entire resource.
                        For the purpose of status, an attachment is considered successful if at
                        least one section in the parent resource accepts it. For example, Gateway
                        listeners can restrict which Routes can attach to them by Route kind,
                        namespace, or hostname. If 1 of 2 Gateway listeners accept attachment from
                        the referencing Route, the Route MUST be considered successfully
                        attached. If no Gateway listeners accept attachment from this Route, the
                        Route MUST be considered detached from the Gateway.

                        Support: Core
                      maxLength: 253
                      minLength: 1
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                      type: string
                  required:
                  - name
                  type: object
                maxItems: 16
                minItems: 1
                type: array
                x-kubernetes-validations:
                - message: only Gateway is supported
                  rule: self.all(match, match.kind == 'Gateway')
              path:
                default: /mcp
                description: |-
                  Path is the HTTP endpoint path that serves MCP requests over the Streamable HTTP transport.
                  If not specified, the default is "/mcp".
                maxLength: 1024
                type: string
              securityPolicy:
                description: SecurityPolicy defines the security policy for this MCPRoute.
                properties:
                  apiKeyAuth:
                    description: APIKeyAuth defines the configuration for the API
                      Key Authentication.
                    properties:
                      credentialRefs:
                        description: |-
                          CredentialRefs is the Kubernetes secret which contains the API keys.
                          This is an Opaque secret.
                          Each API key is stored in the key representing the client id.
                          If the secrets have a key for a duplicated client, the first one will be used.
                        items:
                          description: |-
                            SecretObjectReference identifies an API object including its namespace,
                            defaulting to Secret.

                            The API object must be valid in the cluster; the Group and Kind must
                            be registered in the cluster for this reference to be valid.

                            References to objects with invalid Group and Kind are not valid, and must
                            be rejected by the implementation, with appropriate Conditions set
                            on the containing object.
                          properties:
                            group:
                              default: ""
                              description: |-
                                Group is the group of the referent. For example, "gateway.networking.k8s.io".
                                When unspecified or empty string, core API group is inferred.
                              maxLength: 253
                              pattern: ^$|^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                              type: string
                            kind:
                              default: Secret
                              description: Kind is kind of the referent. For example
                                "Secret".
                              maxLength: 63
                              minLength: 1
                              pattern: ^[a-zA-Z]([-a-zA-Z0-9]*[a-zA-Z0-9])?$
                              type: string
                            name:
                              description: Name is the name of the referent.
                              maxLength: 253
                              minLength: 1
                              type: string
                            namespace:
                              description: |-
                                Namespace is the namespace of the referenced object. When unspecified, the local
