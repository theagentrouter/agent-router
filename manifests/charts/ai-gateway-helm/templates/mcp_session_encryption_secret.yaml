{{- if not .Values.controller.mcp.sessionEncryption.existingSecret }}
{{- $secretName := include "ai-gateway-helm.controller.mcpSessionEncryptionSecretName" . }}
{{- $seed := "" }}
{{- if .Values.controller.mcp.sessionEncryption.seed }}
  {{- $seed = .Values.controller.mcp.sessionEncryption.seed | b64enc }}
{{- else }}
  {{- /* Reuse the existing seed on upgrades, since rotating it would end all active MCP sessions. */}}
  {{- $seed = dig "data" "seed" "" (lookup "v1" "Secret" .Release.Namespace $secretName) }}
  {{- if not $seed }}
    {{- $seed = randAlphaNum 64 | b64enc }}
  {{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ai-gateway-helm.labels" . | nindent 4 }}
type: Opaque
data:
  seed: {{ $seed }}
{{- end }}
