apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ai-gateway-helm.controller.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ai-gateway-helm.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.controller.replicaCount }}
  selector:
    matchLabels:
      {{- include "ai-gateway-helm.controller.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.controller.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "ai-gateway-helm.controller.selectorLabels" . | nindent 8 }}
        {{- with .Values.controller.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with (include "ai-gateway-helm.controller.imagePullSecrets" .) }}
      imagePullSecrets:
        {{- . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "ai-gateway-helm.controller.serviceAccountName" . }}
      hostNetwork: {{ .Values.controller.hostNetwork }}
      {{- if .Values.controller.hostNetwork }}
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      {{- with .Values.controller.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.controller.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.controller.securityContext | nindent 12 }}
          image: "{{ .Values.controller.image.repository }}:{{ .Values.controller.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.controller.imagePullPolicy }}
          ports:
            {{- range .Values.controller.service.ports }}
            - containerPort: {{ .targetPort }}
            {{- end }}
          args:
            - -logLevel={{ .Values.controller.logLevel }}
            - -logFormat={{ .Values.controller.logFormat }}
            - --extProcImage={{ .Values.extProc.image.repository }}:{{ .Values.extProc.image.tag | default .Chart.AppVersion }}
            - --extProcImagePullPolicy={{ .Values.extProc.imagePullPolicy }}
            - --extProcLogLevel={{ .Values.extProc.logLevel }}
            - --extProcLogFormat={{ .Values.extProc.logFormat }}
            - --envoyGatewayNamespace={{ .Values.envoyGateway.namespace }}
            {{- if .Values.extProc.enableRedaction }}
            - --extProcEnableRedaction=true
            {{- end }}
            {{- with (include "ai-gateway-helm.extProc.imagePullSecretsString" .) }}
            - --extProcImagePullSecrets={{ . }}
            {{- end }}
            {{- if .Values.controller.requestHeaderAttributes }}
            - --requestHeaderAttributes={{ .Values.controller.requestHeaderAttributes }}
            {{- end }}
            {{- if ne .Values.controller.spanRequestHeaderAttributes nil }}
            - --spanRequestHeaderAttributes={{ .Values.controller.spanRequestHeaderAttributes }}
            {{- end }}
            {{- if .Values.controller.metricsRequestHeaderAttributes }}
            - --metricsRequestHeaderAttributes={{ .Values.controller.metricsRequestHeaderAttributes }}
            {{- end }}
            {{- if ne .Values.controller.logRequestHeaderAttributes nil }}
            - --logRequestHeaderAttributes={{ .Values.controller.logRequestHeaderAttributes }}
            {{- end }}
            {{- $endpointPrefixes := list -}}
            {{- if hasKey .Values.endpointConfig "openai" -}}
              {{- $openai := .Values.endpointConfig.openai -}}
              {{- $endpointPrefixes = append $endpointPrefixes (printf "openai:%s" $openai) -}}
            {{- end -}}
            {{- if hasKey .Values.endpointConfig "cohere" -}}
              {{- $cohere := .Values.endpointConfig.cohere -}}
              {{- $endpointPrefixes = append $endpointPrefixes (printf "cohere:%s" $cohere) -}}
            {{- end -}}
            {{- if hasKey .Values.endpointConfig "anthropic" -}}
              {{- $anthropic := .Values.endpointConfig.anthropic -}}
              {{- $endpointPrefixes = append $endpointPrefixes (printf "anthropic:%s" $anthropic) -}}
            {{- end -}}
            {{- if $endpointPrefixes }}
            - "--endpointPrefixes={{ join "," $endpointPrefixes }}"
            {{- end }}
            {{- if .Values.extProc.extraEnvVars }}
            - --extProcExtraEnvVars={{ include "ai-gateway-helm.extProc.envVarsString" . }}
            {{- end }}
            - --tlsCertDir=/certs
            - --tlsCertName={{ .Values.controller.mutatingWebhook.tlsCertName }}
            - --tlsKeyName={{ .Values.controller.mutatingWebhook.tlsKeyName }}
            - --webhookPort={{ .Values.controller.mutatingWebhook.port }}
            {{- if .Values.controller.leaderElection.enabled }}
            - --enableLeaderElection=true
            {{- end }}
            - --rootPrefix={{ .Values.endpointConfig.rootPrefix }}
            {{- if ne .Values.controller.maxRecvMsgSize nil }}
            - --maxRecvMsgSize={{ .Values.controller.maxRecvMsgSize }}
            {{- end }}
            - --cacheSyncTimeout={{ .Values.controller.watch.cacheSyncTimeout }}
            - --watchNamespaces={{ join "," .Values.controller.watch.namespaces }}
            - --quotaRateLimitServiceAddr={{ .Values.controller.quotaRateLimitServiceAddr }}
            - --quotaRateLimitTimeout={{ .Values.controller.quotaRateLimitTimeout }}
            - --quotaRateLimitFailureModeDeny={{ .Values.controller.quotaRateLimitFailureModeDeny }}
            - --mcpSessionEncryptionSeed={{ .Values.controller.mcp.sessionEncryption.seed }}
            - --mcpSessionEncryptionIterations={{ .Values.controller.mcp.sessionEncryption.iterations }}
            {{- if .Values.controller.mcp.sessionEncryption.fallback.seed }}
            - --mcpFallbackSessionEncryptionSeed={{ .Values.controller.mcp.sessionEncryption.fallback.seed }}
            - --mcpFallbackSessionEncryptionIterations={{ .Values.controller.mcp.sessionEncryption.fallback.iterations }}
            {{- end }}
          livenessProbe:
            grpc:
              port: 1063
            initialDelaySeconds: 5
            periodSeconds: 2
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          {{- if .Values.controller.podEnv }}
          {{- range $key, $val := .Values.controller.podEnv }}
            - name: {{ $key }}
              value: {{ $val }}
          {{- end }}
          {{- end }}
          {{- if .Values.controller.extraEnvVars }}
          {{- toYaml .Values.controller.extraEnvVars | nindent 12 }}
          {{- end }}
          readinessProbe:
            grpc:
              port: 1063
            initialDelaySeconds: 5
            periodSeconds: 2
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
          volumeMounts:
            - mountPath: /certs
              name: certs
              readOnly: true
          {{- if .Values.controller.volumes }}
            {{- range $volume := .Values.controller.volumes }}
            - mountPath: {{ $volume.mountPath }}
              name: {{ $volume.name }}
              {{- if $volume.subPath }}
              subPath: {{ $volume.subPath }}
              {{- end }}
            {{- end}}
          {{- end }}
      volumes:
        - name: certs
          secret:
            secretName: {{ .Values.controller.mutatingWebhook.tlsCertSecretName }}
      {{- if .Values.controller.volumes }}
        {{- range $volume := .Values.controller.volumes }}
        - name: {{ $volume.name }}
          configMap:
            defaultMode: {{ $volume.configmap.defaultMode }}
            name: {{ $volume.configmap.name }}
        {{- end }}
      {{- end }}
      {{- with .Values.controller.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
