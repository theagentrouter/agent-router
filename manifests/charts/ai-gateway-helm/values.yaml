# Default values for ai-gateway-helm.

# Global values shared across this chart and its subcharts (umbrella charts can set these once).
global:
  # global.imagePullSecrets -- references to pre-created imagePullSecrets in the target namespace
  # Precedence: component-specific values win. If `controller.imagePullSecrets` or
  # `extProc.imagePullSecrets` are set (non-empty), those are used; otherwise this
  # `global.imagePullSecrets` value is used as a fallback (values are not merged).
  # Example:
  # imagePullSecrets:
  #   - name: regcred
  imagePullSecrets: []

# Global configuration for the endpoints supported by the AI Gateway.
endpointConfig:
  # The prefix for all the routes served by the AI Gateway. Defaulting to "/". All the generated routes will have this prefix.
  #
  # With the default "/", the AI Gateway will assume that the downstream client's OpenAI SDK will talk to the Gateway using the base_url
  # set to "http://<gateway-hostname>/v1" which has the default "/v1" prefix in the base_url.
  #
  # This can be used for providing a separation between AIGatewayRoutes and normal HTTPRoutes when the top level "/v1/" is not desired.
  rootPrefix: "/"
  # Explicit provider prefixes.
  # Defaults align with the gateway's built-in provider prefixes.
  # and can be set to empty string to remove the extra provider root segment.
  # Examples:
  #   openai: ""           # results in /v1/...
  #   cohere: "/cohere"   # results in /cohere/v2/...
  #   anthropic: "/anthropic" # results in /anthropic/v1/...
  openai: ""
  cohere: "/cohere"
  anthropic: "/anthropic"

extProc:
  image:
    repository: docker.io/envoyproxy/ai-gateway-extproc
    # Overrides the image tag whose default is the chart appVersion.
    tag: ""
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []
  # One of "info", "debug", "trace", "warn", "error", "fatal", "panic".
  logLevel: info
  # Log output format. One of "text" or "json". Set to "json" when logs are ingested by a pipeline
  # that parses structured records, such as Cloud Logging, Loki, Datadog or ELK.
  logFormat: text
  # Enable redaction of sensitive information in debug logs (only takes effect when logLevel is "debug").
  enableRedaction: false

  ## @param extProc.extraEnvVars Array with extra environment variables to add to extProc containers
  ## e.g:
  ## extraEnvVars:
  ##   - name: OTEL_SERVICE_NAME
  ##     value: "ai-gateway-extproc"
  ##   - name: OTEL_TRACES_EXPORTER
  ##     value: "otlp"
  ##   # This disables pprof endpoint at "localhost:6060/debug/pprof" that can be accessed via port-forwarding for profiling.
  ##   # Enabled by default for troubleshooting purposes given the impact is negligible when not in use.
  ##   - name: DISABLE_PPROF
  ##     value: "true"
  ##   # GCP ADC authentication requests will use this proxy if set.
  ##   - name: AI_GATEWAY_GCP_AUTH_PROXY_URL
  ##     value: "http://proxy.example.com:8080"
  ##   # Emit OpenTelemetry GenAI span attributes instead of the default
  ##   # OpenInference ones, and the OpenTelemetry MCP attributes instead of the
  ##   # gateway-specific mcp.* ones. An unrecognized value fails startup.
  ##   - name: AI_GATEWAY_TRACING_SEMCONV
  ##     value: "gen_ai"
  ##   # The GenAI conventions treat message content as opt-in.
  ##   - name: OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT
  ##     value: "true"
  ##
  extraEnvVars: []

controller:
  logLevel: info
  # Log output format. One of "text" or "json". Set to "json" when logs are ingested by a pipeline
  # that parses structured records, such as Cloud Logging, Loki, Datadog or ELK.
  logFormat: text
  nameOverride: ""
  fullnameOverride: "ai-gateway-controller"

  # Address (host or host:port) of the AI Gateway rate limit service used for QuotaPolicy enforcement.
  # When no port is specified, defaults to 8081.
  quotaRateLimitServiceAddr: "envoy-ai-gateway-ratelimit.envoy-gateway-system"
  # Timeout in seconds for the quota rate limit service.
  quotaRateLimitTimeout: 5
  # If true, requests are denied when the quota rate limit service is unavailable.
  quotaRateLimitFailureModeDeny: false

  # Comma-separated key-value pairs for mapping HTTP request headers to Otel attributes shared across metrics, spans, and access logs.
  # Format: "header1:attribute1,header2:attribute2"
  # Example: "x-tenant-id:tenant.id"
  requestHeaderAttributes: ""

  # Comma-separated key-value pairs for mapping HTTP request headers to otel span attributes.
  # Format: "header1:attribute1,header2:attribute2"
  # Defaults to "agent-session-id:session.id" when unset.
  # Set to "" to disable the default.
  # Example: "x-forwarded-proto:url.scheme,x-tenant-id:tenant.id"
  spanRequestHeaderAttributes: null

  # Comma-separated key-value pairs for mapping HTTP request headers to Otel metric attributes.
  # Format: "header1:label1,header2:label2"
  # Example: "x-tenant-id:tenant.id,x-tenant-id:tenant.id"
  metricsRequestHeaderAttributes: ""

  # Comma-separated key-value pairs for mapping HTTP request headers to access log attributes.
  # Format: "header1:attribute1,header2:attribute2"
  # Defaults to "agent-session-id:session.id" when unset.
  # Set to "" to disable the default.
  # Example: "x-forwarded-proto:url.scheme,x-tenant-id:tenant.id"
  logRequestHeaderAttributes: null


  # -- Service Account --
  serviceAccount:
    # Specifies whether a service account should be created
    create: true
    # Annotations to add to the service account
    annotations: {}
    # The name of the service account to use.
    # If not set and create is true, a name is generated using the fullname template
    name: ""

  # Enable leader election mechanism for protecting against split brain if multiple operator pods/replicas are started.
  leaderElection:
    enabled: true

  # Configuration for how the Kubernetes controllers watch the different resources.
  watch:
    # Namespaces to watch. An empty list means to watch all namespaces.
    # Default is an empty list, to watch all namespaces.
    namespaces: []
    # Sync timeout for the Kubernetes cache. If the cache is not synced within this time, the controller will exit.
    # Default is 2 minutes.
    cacheSyncTimeout: 2m

  # -- Deployment configs --
  image:
    repository: docker.io/envoyproxy/ai-gateway-controller
    # Overrides the image tag whose default is the chart appVersion.
    tag: ""
  imagePullPolicy: IfNotPresent
  replicaCount: 1
  # Optional. Empty omits the field from the pod spec.
  priorityClassName: ""
  imagePullSecrets: []
  podAnnotations: {}
  podLabels: {}
  podDisruptionBudget:
    enabled: false
    annotations: {}
    # Only one of minAvailable or maxUnavailable can be set.
    # If maxUnavailable is set, it takes precedence over minAvailable.
    minAvailable: 1
    # maxUnavailable: 1
  podSecurityContext:
    runAsNonRoot: true
    runAsGroup: 65532
    runAsUser: 65532
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    privileged: false
    runAsNonRoot: true
    runAsGroup: 65532
    runAsUser: 65532
    seccompProfile:
      type: RuntimeDefault
  # DEPRECATED: podEnv will be removed after v0.3. Use controller.extraEnvVars instead.
  # Example of a podEnv
  # AWS STS request when rotating OIDC credentials will be configured to use AI_GATEWAY_STS_PROXY_URL proxy if set.
  #  - key: AI_GATEWAY_STS_PROXY_URL
  #    value: some-proxy-placeholder
  # Azure authentication request will be configured to use AI_GATEWAY_AZURE_PROXY_URL proxy if set.
  #  - key: AI_GATEWAY_AZURE_PROXY_URL
  #    value: some-proxy-placeholder
  # GCP authentication request will be configured to use AI_GATEWAY_GCP_AUTH_PROXY_URL proxy if set.
  #  - key: AI_GATEWAY_GCP_AUTH_PROXY_URL
  #    value: some-proxy-placeholder
  podEnv: {}

  ## @param controller.extraEnvVars Array with extra environment variables to add to controller containers
  ## e.g:
  ## extraEnvVars:
  ##   # This disables pprof endpoint at "localhost:6060/debug/pprof" that can be accessed via port-forwarding for profiling.
  ##   # Enabled by default for troubleshooting purposes given the impact is negligible when not in use.
  ##   - name: DISABLE_PPROF
  ##     value: "true"
  extraEnvVars: []

  # Example of volumes
  #  - mountPath: /placeholder/path
  #    name: volume-name
  #    subPath: placeholder-sub-path
  #    configmap:
  #      defaultMode: placeholder
  #      name: configmap-name
  volumes: []
  service:
    type: ClusterIP
    ports:
      # Note: the port and targetPort here must match mutatingWebhook.port, as the
      # Service needs to route traffic to the webhook server on the same port.
      - name: mutating-webhook
        protocol: TCP
        port: 9443
        appProtocol: http
        targetPort: 9443
      - name: grpc
        protocol: TCP
        port: 1063
        appProtocol: grpc
        targetPort: 1063
      - name: http-metrics
        protocol: TCP
        appProtocol: http
        port: 8080
        targetPort: 8080
      - name: ratelimit-xds
        protocol: TCP
        appProtocol: grpc
        port: 18002
        targetPort: 18002

  mutatingWebhook:
    # The port on which the mutating webhook server listens. Must match the service port defined in service.ports.
    port: 9443
    # The secret that contains the CA certificate and the server certificate for the webhook server.
    # Defaults to the self-signed cert generated by the project. The namespace of the secret
    # must be the same as the namespace of the controller installation.
    #
    # The self-signed cert is embedded as part of the helm chart, so it is not recommended for production use.
    # You can use the configurations below to specify a custom secret that contains the CA certificate and the server certificate.
    #
    # When specifying a secret generated by cert-manager, other fields (tlsCertName, tlsKeyName and caBundleName)
    # do not need to be set modified since they match the default values by cert-manager:
    # https://cert-manager.io/docs/usage/certificate/
    tlsCertSecretName: self-signed-cert-for-mutating-webhook
    # The name of the CA certificate in the secret to serve the webhook.
    tlsCertName: tls.crt
    # The name of the server certificate in the secret to serve the webhook.
    tlsKeyName: tls.key
    # The name of the CA bundle in the secret to use for the webhook.
    caBundleName: ca.crt
    # When cert-manager is enabled, the self-signed cert is created and rotated by cert-manager.
    certManager:
      enable: false
      # The name of the issuer.
      issuerName: self-signed-issuer-for-mutating-webhook
      # The name of the certificate.
      certificateName: self-signed-cert-for-mutating-webhook
    # The object selector for the mutating webhook. By default it selects envoy-gateway managed objects.
    objectSelector:
      matchLabels:
        app.kubernetes.io/managed-by: envoy-gateway
    # Example of namespaceSelector to select the webhook target based on namespaces.
    # See: https://kubernetes.io/docs/reference/access-authn-authz/extensible-admission-controllers/#matching-requests-namespaceselector
    #   namespaceSelector:
    #     matchExpressions:
    #     - key: environment
    #       operator: In
    #       values: ["prod","staging"]

  # When true, the controller pod uses the host's network namespace.
  # When enabled, dnsPolicy defaults to "ClusterFirstWithHostNet" so that
  # DNS resolution continues to work correctly inside the pod.
  hostNetwork: false

  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []

  # maxRecvMsgSize is the maximum message size in bytes that the gRPC extension server can receive
  # from xDS (envoy-gateway).
  # This value should be increased in setups where count/complexity of xDS
  # resources (configuration) is big. Defaults to 4MB.
  # maxRecvMsgSize: "4194304"

  # MCP Proxy settings
  mcp:
    # Configuration for MCP session encryption.
    sessionEncryption:
      # Seed used to derive the MCP session encryption key.
      # This value should be set to a secure random string in production environments instead of the default below.
      seed: "default-insecure-seed"
      # Number of PBKDF2 iterations to use for deriving the MCP session encryption key.
      # A higher number increases security but also increases CPU usage and time consumed during key derivation.
      # The default value of 100,000 is a reasonable balance for most production environments.
      iterations: 100000
      # Optional fallback configuration for MCP session encryption key rotation.
      fallback:
        # Fallback seed used to derive the MCP session encryption key.
        # Set to a non-empty value to enable fallback.
        # It should be the previous seed used before changing to the new seed.
        seed: ""
        # Number of PBKDF2 iterations to use for deriving the MCP session encryption key with the fallback seed.
        iterations: 100000

# Configuration for the Envoy Gateway component that AI Gateway relies on to program Envoy.
envoyGateway:
  # The namespace where the Envoy Gateway controller is installed.
  namespace : envoy-gateway-system
