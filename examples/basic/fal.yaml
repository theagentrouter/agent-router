apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIGatewayRoute
metadata:
  name: envoy-ai-gateway-basic-fal
  namespace: default
spec:
  parentRefs:
    - name: envoy-ai-gateway-basic
      kind: Gateway
      group: gateway.networking.k8s.io
  rules:
    - matches:
        - headers:
            - type: RegularExpression
              name: x-ai-eg-original-path
              value: /fal/run/.*
      backendRefs:
        - name: envoy-ai-gateway-basic-fal-run
    - matches:
        - headers:
            - type: RegularExpression
              name: x-ai-eg-original-path
              value: /fal/queue/.*
      backendRefs:
        - name: envoy-ai-gateway-basic-fal-queue
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: envoy-ai-gateway-basic-fal-run
  namespace: default
spec:
  schema:
    name: Fal
  backendRef:
    name: envoy-ai-gateway-basic-fal-run
    kind: Backend
    group: gateway.envoyproxy.io
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: envoy-ai-gateway-basic-fal-queue
  namespace: default
spec:
  schema:
    name: Fal
  backendRef:
    name: envoy-ai-gateway-basic-fal-queue
    kind: Backend
    group: gateway.envoyproxy.io
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: BackendSecurityPolicy
metadata:
  name: envoy-ai-gateway-basic-fal-apikey
  namespace: default
spec:
  targetRefs:
    - group: aigateway.envoyproxy.io
      kind: AIServiceBackend
      name: envoy-ai-gateway-basic-fal-run
    - group: aigateway.envoyproxy.io
      kind: AIServiceBackend
      name: envoy-ai-gateway-basic-fal-queue
  type: FalAPIKey
  falAPIKey:
    secretRef:
      name: envoy-ai-gateway-basic-fal-apikey
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: envoy-ai-gateway-basic-fal-run
  namespace: default
spec:
  endpoints:
    - fqdn:
        hostname: fal.run
        port: 443
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: envoy-ai-gateway-basic-fal-queue
  namespace: default
spec:
  endpoints:
    - fqdn:
        hostname: queue.fal.run
        port: 443
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: envoy-ai-gateway-basic-fal-run-tls
  namespace: default
spec:
  targetRefs:
    - group: "gateway.envoyproxy.io"
      kind: Backend
      name: envoy-ai-gateway-basic-fal-run
  validation:
    wellKnownCACertificates: "System"
    hostname: fal.run
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: envoy-ai-gateway-basic-fal-queue-tls
  namespace: default
spec:
  targetRefs:
    - group: "gateway.envoyproxy.io"
      kind: Backend
      name: envoy-ai-gateway-basic-fal-queue
  validation:
    wellKnownCACertificates: "System"
    hostname: queue.fal.run
---
apiVersion: v1
kind: Secret
metadata:
  name: envoy-ai-gateway-basic-fal-apikey
  namespace: default
type: Opaque
stringData:
  apiKey: FAL_API_KEY # Replace with your fal API key.
