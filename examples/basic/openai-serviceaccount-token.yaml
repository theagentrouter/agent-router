apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIGatewayRoute
metadata:
  name: envoy-ai-gateway-basic-openai-serviceaccount-token
  namespace: default
spec:
  parentRefs:
    - name: envoy-ai-gateway-basic
      kind: Gateway
      group: gateway.networking.k8s.io
  rules:
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: gpt-4o-mini
      backendRefs:
        - name: envoy-ai-gateway-basic-openai-serviceaccount-token
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: envoy-ai-gateway-basic-openai-serviceaccount-token
  namespace: default
spec:
  schema:
    name: OpenAI
  backendRef:
    name: envoy-ai-gateway-basic-openai-serviceaccount-token
    kind: Backend
    group: gateway.envoyproxy.io
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: BackendSecurityPolicy
metadata:
  name: envoy-ai-gateway-basic-openai-serviceaccount-token-credentials
  namespace: default
spec:
  targetRefs:
    - group: aigateway.envoyproxy.io
      kind: AIServiceBackend
      name: envoy-ai-gateway-basic-openai-serviceaccount-token
  type: OpenAICredentials
  # The controller requests a token for the ServiceAccount below from the Kubernetes TokenRequest API and
  # exchanges it for a short-lived OpenAI access token via OpenAI Workload Identity Federation, rotating it
  # before it expires. A new ServiceAccount token is requested for every exchange.
  #
  # The identity provider (trusting the issuer of your cluster's ServiceAccount tokens) and the service
  # account mapping must be configured in your OpenAI organization:
  # https://developers.openai.com/api/docs/guides/workload-identity-federation/kubernetes
  openAICredentials:
    organization: OPENAI_ORGANIZATION_ID # Optional. Replace with your OpenAI organization ID, or remove.
    project: OPENAI_PROJECT_ID # Optional. Replace with your OpenAI project ID, or remove.
    workloadIdentityFederationConfig:
      identityProviderID: OPENAI_IDENTITY_PROVIDER_ID # Replace with your OpenAI Workload Identity Provider ID.
      serviceAccountID: OPENAI_SERVICE_ACCOUNT_ID # Replace with your OpenAI service account ID.
      subjectToken:
        serviceAccountToken:
          # A ServiceAccount in the namespace of this policy.
          serviceAccountName: envoy-ai-gateway-basic-openai-federation
          audience: OPENAI_IDENTITY_PROVIDER_AUDIENCE # Replace with the audience configured for the identity provider.
---
# The identity the policy authenticates to OpenAI as. It does not need to be used by any pod.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: envoy-ai-gateway-basic-openai-federation
  namespace: default
---
# Allows the controller to request tokens for that ServiceAccount only. This is needed unless the chart is
# installed with controller.serviceAccountTokens.grantClusterWide=true.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: envoy-ai-gateway-basic-openai-federation-token
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    resourceNames: ["envoy-ai-gateway-basic-openai-federation"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: envoy-ai-gateway-basic-openai-federation-token
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: envoy-ai-gateway-basic-openai-federation-token
subjects:
  # The controller's ServiceAccount, as installed by the ai-gateway-helm chart.
  - kind: ServiceAccount
    name: ai-gateway-controller
    namespace: envoy-ai-gateway-system
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: envoy-ai-gateway-basic-openai-serviceaccount-token
  namespace: default
spec:
  endpoints:
    - fqdn:
        hostname: api.openai.com
        port: 443
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: envoy-ai-gateway-basic-openai-serviceaccount-token-tls
  namespace: default
spec:
  targetRefs:
    - group: "gateway.envoyproxy.io"
      kind: Backend
      name: envoy-ai-gateway-basic-openai-serviceaccount-token
  validation:
    wellKnownCACertificates: "System"
    hostname: api.openai.com
