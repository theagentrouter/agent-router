apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIGatewayRoute
metadata:
  name: envoy-ai-gateway-basic-gemini
  namespace: default
spec:
  parentRefs:
    - name: envoy-ai-gateway-basic
      kind: Gateway
      group: gateway.networking.k8s.io
  rules:
    - matches:
        - pathPrefix: /gemini/v1beta/models
          headers:
            - type: Exact
              name: x-ai-eg-model
              value: gemini-3.5-flash-lite
      backendRefs:
        - name: envoy-ai-gateway-basic-gemini
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: envoy-ai-gateway-basic-gemini
  namespace: default
spec:
  schema:
    name: GoogleAIStudio
  backendRef:
    name: envoy-ai-gateway-basic-gemini
    kind: Backend
    group: gateway.envoyproxy.io
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: BackendSecurityPolicy
metadata:
  name: envoy-ai-gateway-basic-gemini
  namespace: default
spec:
  targetRefs:
    - group: aigateway.envoyproxy.io
      kind: AIServiceBackend
      name: envoy-ai-gateway-basic-gemini
  type: GoogleAPIKey
  googleAPIKey:
    secretRef:
      name: envoy-ai-gateway-basic-gemini
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: envoy-ai-gateway-basic-gemini
  namespace: default
spec:
  endpoints:
    - fqdn:
        hostname: generativelanguage.googleapis.com
        port: 443
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: envoy-ai-gateway-basic-gemini
  namespace: default
spec:
  targetRefs:
    - group: gateway.envoyproxy.io
      kind: Backend
      name: envoy-ai-gateway-basic-gemini
  validation:
    wellKnownCACertificates: System
    hostname: generativelanguage.googleapis.com
---
apiVersion: v1
kind: Secret
metadata:
  name: envoy-ai-gateway-basic-gemini
  namespace: default
type: Opaque
stringData:
  apiKey: GEMINI_API_KEY # Replace with your Gemini API key.
