# Replace SCW_PROJECT_ID and SCW_MODEL_ID with your Scaleway values.
# Discover available models using GET https://api.scaleway.ai/<project_id>/v1/models
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIGatewayRoute
metadata:
  name: envoy-ai-gateway-basic-scaleway
  namespace: default
spec:
  parentRefs:
    - name: envoy-ai-gateway-basic
      kind: Gateway
      group: gateway.networking.k8s.io
  rules:
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: SCW_MODEL_ID
      backendRefs:
        - name: envoy-ai-gateway-basic-scaleway
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: envoy-ai-gateway-basic-scaleway
  namespace: default
spec:
  schema:
    name: OpenAI
    prefix: /SCW_PROJECT_ID/v1
  backendRef:
    name: envoy-ai-gateway-basic-scaleway
    kind: Backend
    group: gateway.envoyproxy.io
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: BackendSecurityPolicy
metadata:
  name: envoy-ai-gateway-basic-scaleway-apikey
  namespace: default
spec:
  targetRefs:
    - group: aigateway.envoyproxy.io
      kind: AIServiceBackend
      name: envoy-ai-gateway-basic-scaleway
  type: APIKey
  apiKey:
    secretRef:
      name: envoy-ai-gateway-basic-scaleway-apikey
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: envoy-ai-gateway-basic-scaleway
  namespace: default
spec:
  endpoints:
    - fqdn:
        hostname: api.scaleway.ai
        port: 443
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: envoy-ai-gateway-basic-scaleway-tls
  namespace: default
spec:
  targetRefs:
    - group: gateway.envoyproxy.io
      kind: Backend
      name: envoy-ai-gateway-basic-scaleway
  validation:
    wellKnownCACertificates: System
    hostname: api.scaleway.ai
---
apiVersion: v1
kind: Secret
metadata:
  name: envoy-ai-gateway-basic-scaleway-apikey
  namespace: default
type: Opaque
stringData:
  apiKey: SCW_SECRET_KEY
