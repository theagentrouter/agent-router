# Let this actor reach Agent Router over cleartext HTTP (port 80) and have the
# egress gateway swap its placeholder Authorization header for an actor JWT.
# Only listed hostnames resolve inside the sandbox, so use the exact FQDN the
# actor dials. Apply with:
#   kubectl ate create egress-policy <actor> -a agents -f <this file>
rules:
  - http:
      hostnames: ["agent-router.envoy-gateway-system.svc.cluster.local"]
      effects:
        replaceHeaders:
          - header: Authorization
            prefix: "Bearer "
            actorJwt:
              audiences: ["agent-router"]
              expirationSeconds: 900
