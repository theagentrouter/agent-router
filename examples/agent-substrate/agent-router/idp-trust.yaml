# Substrate's identity provider serves the actor JWT signing keys at
# https://idp.ate-system.svc/openid/v1/jwks with a certificate from Substrate's
# Service DNS signer. Envoy fetches the JWKS through this Backend.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: substrate-idp
  namespace: agent-router-demo
spec:
  endpoints:
    - fqdn:
        hostname: idp.ate-system.svc.cluster.local
        port: 443
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: substrate-idp
  namespace: agent-router-demo
spec:
  targetRefs:
    - group: gateway.envoyproxy.io
      kind: Backend
      name: substrate-idp
  validation:
    # Trust Substrate's Service DNS CA straight from its ClusterTrustBundle, so
    # a CA rotation needs no copy step.
    caCertificateRefs:
      - group: certificates.k8s.io
        kind: ClusterTrustBundle
        name: servicedns.podcert.ate.dev:identity:primary-bundle
    # The IdP certificate's only DNS name is <svc>.<ns>.svc.
    hostname: idp.ate-system.svc
