name: Release
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+**" # Ex. v0.2.0 v0.2.1-rc2

jobs:
  docker_push:
    name: Push Docker Images
    uses: ./.github/workflows/docker_build_job.yaml
    secrets: inherit

  # Run the Gateway API Inference Extension conformance tests against the tagged commit so that every
  # release ships with a conformance report whose implementation version matches the release tag.
  inference_extension_conformance:
    name: Inference Extension Conformance Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
        with:
          cache: false
          go-version-file: go.mod
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - run: make test-e2e-inference-extension GO_TEST_E2E_ARGS="-count=1 -timeout 30m -run TestGatewayAPIInferenceExtension"
        env:
          # Run against the latest stable Envoy Gateway release, keep in sync with build_and_test.yaml.
          EG_VERSION: v1.10.0
      - name: Upload conformance test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: inference-extension-conformance-test-report
          path: tests/e2e-inference-extension/inference-extension-conformance-test-report.yaml
          if-no-files-found: error

  release:
    needs: [docker_push, inference_extension_conformance]
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release create requires contents:write
    steps:
      - name: Set HELM_CHART_VERSION and TAG envs
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "HELM_CHART_VERSION=${TAG}" >> $GITHUB_ENV
          echo "HELM_CHART_VERSION_WITHOUT_V=$(echo ${TAG#v})" >> $GITHUB_ENV
          echo "TAG=${TAG}" >> $GITHUB_ENV

      # To include the helm chart in the release artifact, we build and push it here instead of the separate job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Login into DockerHub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Push Helm chart
        run: |
          make helm-push HELM_CHART_VERSION=${HELM_CHART_VERSION}
          make helm-push HELM_CHART_VERSION=${HELM_CHART_VERSION_WITHOUT_V}

      - name: Build CLI release binaries
        run: |
          make build.aigw GOOS_LIST="linux" GOARCH_LIST="amd64 arm64"
          # amd64 for macos is not available on archive-envoy for the last few table versions
          # which in turn is used by EG's standalone mode used by aigw, so we skip it
          make build.aigw GOOS_LIST="darwin" GOARCH_LIST="arm64"

      - name: Generate checksums for CLI release binaries
        # Bare file names (no ./out/ prefix), so install.sh and "sha256sum -c" match on the asset name.
        run: cd ./out && sha256sum aigw-* | tee checksums.txt

      - name: Download conformance test report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: inference-extension-conformance-test-report
          path: ./out/conformance

      - name: Rename conformance test report
        run: mv ./out/conformance/inference-extension-conformance-test-report.yaml ./out/inference-extension-conformance-test-report-${TAG}.yaml

      - name: Create a release candidate
        if: ${{ contains(github.ref, '-rc') }}
        run: |
          gh release create $TAG --prerelease --title $TAG --notes "Release candidate" \
            ./out/ai-gateway-crds-helm-${TAG}.tgz \
            ./out/ai-gateway-helm-${TAG}.tgz \
            ./out/aigw-* \
            ./out/checksums.txt \
            ./out/inference-extension-conformance-test-report-${TAG}.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create a stable release
        if: ${{ !contains(github.ref, '-rc') }}
        run: |
          gh release create $TAG --draft --title $TAG --notes "To be written by the release manager" \
            ./out/ai-gateway-crds-helm-${TAG}.tgz \
            ./out/ai-gateway-helm-${TAG}.tgz \
            ./out/aigw-* \
            ./out/checksums.txt \
            ./out/inference-extension-conformance-test-report-${TAG}.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
