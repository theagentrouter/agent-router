name: Approval Policy

# Enforces the approval rules in COMMUNITY_ROLES.md: one Maintainer approval, or two Reviewer
# approvals where at least one Reviewer works at a different company from the author.
#
# The job name, approval-policy, is a required status check on main. Changes to this file need a
# Maintainer's approval through CODEOWNERS, which is what stops a pull request from weakening its
# own check.

on:
  pull_request:
    branches:
      - "main"
    types: [opened, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: approval-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  approval-policy:
    name: approval-policy
    # pull_request_review has no branch filter, so skip reviews on release branch pull requests.
    if: github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      # Check out main rather than the pull request, so the pull request can't change the checker
      # or the OWNERS roster it is evaluated against. Nothing from the pull request is run.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false
          sparse-checkout: tools
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: tools/go.mod
          cache-dependency-path: tools/go.sum
      - name: Check approvals
        working-directory: tools
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: go run ./approvalpolicy -owners ../OWNERS -repo "$GITHUB_REPOSITORY" -pr "$PR_NUMBER" -author "$PR_AUTHOR"
