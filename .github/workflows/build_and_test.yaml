name: Build and Test
on:
  pull_request:
    branches:
      - "main"
      # Release branches are like "release/v0.1", "release/v0.2", etc. where we backport the changes to non EOL versions.
      # The branch will be created from the main branch after the initial release tag is cut. For example, when we cut v0.8.0 release,
      # we will create a branch "release/v0.8" from the main branch. For rc release, we simply iterate on main branch.
      #
      # See RELEASES.md for more details.
      - "release/**"

  push:
    branches:
      - "main"
      - "release/**"

concurrency:
  # https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#example-using-concurrency-to-cancel-any-in-progress-job-or-run
  group: ${{ github.ref }}-${{ github.workflow }}-${{ github.actor }}-${{ github.event_name }}
  # Runs on main are not cancelled: aigw_main_release could be stopped halfway through updating
  # the latest-main release, leaving missing assets. Queued runs are still replaced by newer ones.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  changes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
      - uses: dorny/paths-filter@b41dfa943b1939b9b646f67753bfe35cf6e4de03
        id: changes
        with:
          filters: |
            code:
              - '!**/*.md'
              - '!docs/**'
              - '!site/**'
              - '!netlify.toml'
          predicate-quantifier: every # Make the filters be AND-ed
          token: "" # don't use github api
      - uses: dorny/paths-filter@b41dfa943b1939b9b646f67753bfe35cf6e4de03
        id: install_script
        with:
          filters: |
            install_script:
              - 'site/static/install.sh'
              - 'tests/install/**'
          token: "" # don't use github api
    outputs:
      code: ${{ steps.changes.outputs.code }}
      install_script: ${{ steps.install_script.outputs.install_script }}

  test_install_script:
    # The install script lives in the docs site, which the "code" filter ignores, so it has its own filter.
    needs: changes
    if: ${{ needs.changes.outputs.install_script == 'true' }}
    name: Install Script Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v5
        with:
          cache: false
          go-version-file: go.mod
      - name: Shellcheck
        run: shellcheck site/static/install.sh # Preinstalled on the GitHub-hosted Ubuntu runners.
      - run: go test -v ./tests/install/

  unittest:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    name: Unit Test
    env:
      # Pin the version for deterministic behaviour of aigw run
      ENVOY_VERSION: 1.40.2
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v5
        with:
          cache: false
          go-version-file: go.mod
      - name: Get Go build cache path
        id: go_cache
        run: |
          cache_path=$(go env GOCACHE)
          echo "path=$cache_path" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          path: |
            ${{ steps.go_cache.outputs.path }}
            ~/go/pkg/mod
            ~/go/bin
          key: unittest-${{ hashFiles('**/go.mod', '**/go.sum', '**/Makefile') }}-${{ matrix.os }}
      - run: make test-coverage GO_TEST_ARGS='-race'
      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6.0.2
        with:
          fail_ci_if_error: true
          files: ./out/go-test-coverage.out
          name: codecov-envoy-agent-router
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}

  test_crdcel:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    name: CRD CEL Validation Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v5
        with:
          cache: false
          go-version-file: go.mod
      - name: Get Go build cache path
        id: go_cache
        run: |
          cache_path=$(go env GOCACHE)
          echo "path=$cache_path" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          path: |
            ${{ steps.go_cache.outputs.path }}
            ~/go/pkg/mod
            ~/go/bin
          key: controller-test-${{ hashFiles('**/go.mod', '**/go.sum', '**/Makefile') }}-${{ matrix.os }}
      - run: make test-crdcel

  test_controller:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    name: Controller Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v5
        with:
          cache: false
          go-version-file: go.mod
      - name: Get Go build cache path
        id: go_cache
        run: |
          cache_path=$(go env GOCACHE)
          echo "path=$cache_path" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          path: |
            ${{ steps.go_cache.outputs.path }}
            ~/go/pkg/mod
            ~/go/bin
          key: controller-test-${{ hashFiles('**/go.mod', '**/go.sum', '**/Makefile') }}-${{ matrix.os }}
      - run: make test-controller

  test_data_plane:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    name: Data Plane Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v5
        with:
          cache: false
          go-version-file: go.mod
      - name: Get Go build cache path
        id: go_cache
        run: |
          cache_path=$(go env GOCACHE)
          echo "path=$cache_path" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          path: |
            ${{ steps.go_cache.outputs.path }}
            ~/go/pkg/mod
            ~/go/bin
          key: data-plane-tests-${{ hashFiles('**/go.mod', '**/go.sum', '**/Makefile') }}
      - env:
          TEST_AWS_ACCESS_KEY_ID: ${{ secrets.AWS_BEDROCK_USER_AWS_ACCESS_KEY_ID }}
          TEST_AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_BEDROCK_USER_AWS_SECRET_ACCESS_KEY }}
          TEST_OPENAI_API_KEY: ${{ secrets.ENVOY_AI_GATEWAY_OPENAI_API_KEY }}
          TEST_GEMINI_API_KEY: ${{ secrets.ENVOY_AI_GATEWAY_GEMINI_API_KEY }}
          TEST_COHERE_API_KEY: ${{ secrets.ENVOY_AI_GATEWAY_COHERE_API_KEY }}
          TEST_TYPESAFE_API_KEY: ${{ secrets.ENVOY_AI_GATEWAY_TYPESAFE_API_KEY }}
          TEST_GROQ_API_KEY: ${{ secrets.ENVOY_AI_GATEWAY_GROQ_API_KEY }}
          TEST_GROK_API_KEY: ${{ secrets.ENVOY_AI_GATEWAY_GROK_API_KEY }}
          TEST_SAMBANOVA_API_KEY: ${{ secrets.ENVOY_AI_GATEWAY_SAMBANOVA_API_KEY }}
          TEST_DEEPINFRA_API_KEY: ${{ secrets.ENVOY_AI_GATEWAY_DEEPINFRA_API_KEY }}
          TEST_OPENROUTER_API_KEY: ${{ secrets.ENVOY_AI_GATEWAY_OPENROUTER_API_KEY }}
        run: make test-data-plane

  test_data_plane_mcp:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    name: Data Plane MCP Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v5
        with:
          cache: false
          go-version-file: go.mod
      - name: Get Go build cache path
        id: go_cache
        run: |
          cache_path=$(go env GOCACHE)
          echo "path=$cache_path" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          path: |
            ${{ steps.go_cache.outputs.path }}
            ~/go/pkg/mod
            ~/go/bin
          key: data-plane-tests-${{ hashFiles('**/go.mod', '**/go.sum', '**/Makefile') }}
      - run: make test-data-plane-mcp
        env:
          TEST_GITHUB_ACCESS_TOKEN: ${{ secrets.TEST_GITHUB_ACCESS_TOKEN }}

  test_e2e:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    # Not all the cases in E2E require secrets, so we run for all the events.
    name: E2E Test (Envoy Gateway ${{ matrix.name }})
    # TODO: make it possible to run this job on macOS as well, which is a bit tricky due to the nested
    # virtualization is not supported on macOS runners.
    # E.g. Use https://github.com/douglascamata/setup-docker-macos-action  per the comment in
    # https://github.com/actions/runner-images/issues/17#issuecomment-1971073406
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: latest
            envoy_gateway_version: v0.0.0-latest
          - name: v1.10.0
            envoy_gateway_version: v1.10.0
          - name: v1.9.4
            envoy_gateway_version: v1.9.4
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v5
        with:
          cache: false
          go-version-file: go.mod
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          path: |
            ~/.cache/go-build
            ~/.cache/golangci-lint
            ~/go/pkg/mod
            ~/go/bin
          key: e2e-test-${{ hashFiles('**/go.mod', '**/go.sum', '**/Makefile') }}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - env:
          EG_VERSION: ${{ matrix.envoy_gateway_version }}
          TEST_AWS_ACCESS_KEY_ID: ${{ secrets.AWS_BEDROCK_USER_AWS_ACCESS_KEY_ID }}
          TEST_AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_BEDROCK_USER_AWS_SECRET_ACCESS_KEY }}
          TEST_OPENAI_API_KEY: ${{ secrets.ENVOY_AI_GATEWAY_OPENAI_API_KEY }}
          TEST_ANTHROPIC_API_KEY: ${{ secrets.ENVOY_AI_GATEWAY_ANTHROPIC_API_KEY }}
          TEST_GEMINI_API_KEY: ${{ secrets.ENVOY_AI_GATEWAY_GEMINI_API_KEY }}
          TEST_COHERE_API_KEY: ${{ secrets.ENVOY_AI_GATEWAY_COHERE_API_KEY }}
          TEST_TYPESAFE_API_KEY: ${{ secrets.ENVOY_AI_GATEWAY_TYPESAFE_API_KEY }}
        run: make test-e2e

  test_e2e_upgrade:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    name: E2E Test for Upgrades (k8s ${{ matrix.k8s-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        k8s-version:
          - v1.35.0
          - v1.34.3
          - v1.33.4
          - v1.32.8
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v5
        with:
          cache: false
          go-version-file: go.mod
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          path: |
            ~/.cache/go-build
            ~/.cache/golangci-lint
            ~/go/pkg/mod
            ~/go/bin
          key: e2e-test-${{ hashFiles('**/go.mod', '**/go.sum', '**/Makefile') }}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - run: make test-e2e-upgrade
        env:
          # We only need to test the upgrade from the latest stable version of EG.
          EG_VERSION: v1.10.0
          K8S_VERSION: ${{ matrix.k8s-version }}

  test_e2e_inference_extension:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    name: E2E Test for Inference Extensions (Envoy Gateway ${{ matrix.name }})
    # TODO: make it possible to run this job on macOS as well, which is a bit tricky due to the nested
    # virtualization is not supported on macOS runners.
    # E.g. Use https://github.com/douglascamata/setup-docker-macos-action  per the comment in
    # https://github.com/actions/runner-images/issues/17#issuecomment-1971073406
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # TODO: remove the latest entry once Envoy Gateway v1.11.0 is released.
          - name: latest
            envoy_gateway_version: v0.0.0-latest
          - name: v1.10.0
            envoy_gateway_version: v1.10.0
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v5
        with:
          cache: false
          go-version-file: go.mod
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          path: |
            ~/.cache/go-build
            ~/.cache/golangci-lint
            ~/go/pkg/mod
            ~/go/bin
          key: e2e-test-${{ hashFiles('**/go.mod', '**/go.sum', '**/Makefile') }}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - run: make test-e2e-inference-extension
        env:
          EG_VERSION: ${{ matrix.envoy_gateway_version }}
      - name: Upload conformance test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: inference-extension-conformance-test-report-${{ matrix.name }}
          path: tests/e2e-inference-extension/inference-extension-conformance-test-report.yaml
          if-no-files-found: warn

  test_e2e_namespaced:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    name: E2E Test for Namespaced Controller
    # TODO: make it possible to run this job on macOS as well, which is a bit tricky due to the nested
    # virtualization is not supported on macOS runners.
    # E.g. Use https://github.com/douglascamata/setup-docker-macos-action  per the comment in
    # https://github.com/actions/runner-images/issues/17#issuecomment-1971073406
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v5
        with:
          cache: false
          go-version-file: go.mod
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          path: |
            ~/.cache/go-build
            ~/.cache/golangci-lint
            ~/go/pkg/mod
            ~/go/bin
          key: e2e-test-${{ hashFiles('**/go.mod', '**/go.sum', '**/Makefile') }}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - run: make test-e2e-namespaced
        env:
          # We only need to test with the latest stable version of EG, since these e2e tests
          # do not depend on the EG version.
          EG_VERSION: v1.10.0

  test_e2e_aigw:
    needs: changes
    name: E2E Test for aigw CLI
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v5
        with:
          cache: false
          go-version-file: go.mod
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          path: |
            ~/.cache/go-build
            ~/.cache/golangci-lint
            ~/go/pkg/mod
            ~/go/bin
          key: e2e-aigw-test-${{ hashFiles('**/go.mod', '**/go.sum', '**/Makefile') }}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Start Ollama server
        run: |
          curl -fsSL https://ollama.com/install.sh | sh && sudo systemctl stop ollama
          nohup ollama serve > ollama.log 2>&1 &
          timeout 30 sh -c 'until nc -z localhost 11434; do sleep 1; done'
          grep _MODEL .env.ollama | cut -d= -f2 | xargs -I{} ollama pull {}
        env:
          OLLAMA_CONTEXT_LENGTH: 32768 # cap KV cache to avoid runner OOM, goose recipe is not run in CI
          OLLAMA_HOST: 0.0.0.0
      # Download Envoy via func-e using implicit default version `aigw` would
      # otherwise need to download during test runs.
      - name: Download Envoy via func-e
        run: go tool -modfile=tools/go.mod func-e run --version
        env:
          FUNC_E_DATA_HOME: ~/.local/share/aigw
      - env:
          TEST_GITHUB_ACCESS_TOKEN: ${{ secrets.TEST_GITHUB_ACCESS_TOKEN }}
        run: make test-e2e-aigw
      - if: failure()
        run: cat ollama.log || true

  compute_version:
    # Runs on PRs too, so GitVersion's output shows up in checks before it can affect main; docker_push/helm_push below stay push-only, so nothing publishes here.
    name: Compute dev version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
        with:
          fetch-depth: 0
      - name: Install GitVersion
        continue-on-error: true
        uses: gittools/actions/gitversion/setup@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0
        with:
          versionSpec: "6.x"
      - name: Determine next version
        id: gitversion
        continue-on-error: true
        # GitVersion reads the branch from GITHUB_REF, which on a PR is "refs/pull/N/merge"; override it to the PR's base branch so the preview uses that branch's config instead of GitVersion's default PullRequest config.
        env:
          GITHUB_REF: ${{ github.event_name == 'pull_request' && format('refs/heads/{0}', github.base_ref) || github.ref }}
        uses: gittools/actions/gitversion/execute@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0
      - name: Compute dev tag
        id: version
        env:
          MMP: ${{ steps.gitversion.outputs.majorMinorPatch }}
        run: |
          DEV_TAG=""
          if [ -n "$MMP" ]; then
            DEV_TAG="v${MMP}-dev.$(date -u +%Y-%m-%d-%H-%M)"
          fi
          if [ -z "$MMP" ]; then
            if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
              echo "::error::GitVersion produced no majorMinorPatch; fix GitVersion before merging."
              exit 1
            fi
            echo "::warning::GitVersion produced no majorMinorPatch (setup/execute step likely failed above); this push to main will fall back to SHA-based tagging only."
          fi
          if [ "$GITHUB_REF" = "refs/heads/main" ] && [ -n "$DEV_TAG" ]; then
            echo "version=$DEV_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "version=" >> "$GITHUB_OUTPUT"
          fi

  docker_push:
    # Docker builds are verified in test_e2e job, so we only need to push the images when the event is a push event.
    if: github.event_name == 'push'
    name: Push Docker Images
    needs: [ci-required, compute_version]
    uses: ./.github/workflows/docker_build_job.yaml
    with:
      tag: ${{ needs.compute_version.outputs.version }}
    secrets: inherit

  helm_push:
    name: Push Helm chart
    # Only push the Helm chart to the GHR when merged into the main branch.
    if: github.event_name == 'push'
    needs: [docker_push, compute_version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
      - name: Login into DockerHub
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - env:
          DEV_VERSION: ${{ needs.compute_version.outputs.version }}
        run: |
          make helm-push HELM_CHART_VERSION=v0.0.0-latest
          make helm-push HELM_CHART_VERSION=0.0.0-latest
          make helm-push HELM_CHART_VERSION=v0.0.0-${{ github.sha }} TAG=${{ github.sha }}
          make helm-push HELM_CHART_VERSION=0.0.0-${{ github.sha }} TAG=${{ github.sha }}
          if [ -n "$DEV_VERSION" ]; then
            make helm-push HELM_CHART_VERSION=${DEV_VERSION} TAG=${DEV_VERSION}
            make helm-push HELM_CHART_VERSION=${DEV_VERSION#v} TAG=${DEV_VERSION}
          fi

  aigw_main_release:
    name: Publish aigw binaries from main
    # Keeps the "latest-main" prerelease up to date with aigw binaries built from main, so that
    # the install script (site/static/install.sh) can install the latest main without waiting for a release.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ci-required]
    # The workflow-level concurrency group includes the actor, so pushes by different people could
    # publish at the same time. Serialize the publishing: queued runs are replaced by the newest one.
    concurrency:
      group: aigw-main-release
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release create/upload/edit and moving the tag require contents:write
    env:
      RELEASE_TAG: latest-main
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
        with:
          fetch-depth: 0 # git describe needs the release tags to compute the version string
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v5
        with:
          cache: false
          go-version-file: go.mod
      - name: Build CLI binaries
        # Same platforms as the release workflow (no darwin/amd64, see release.yaml).
        run: |
          make build.aigw GOOS_LIST="linux" GOARCH_LIST="amd64 arm64"
          make build.aigw GOOS_LIST="darwin" GOARCH_LIST="arm64"
      - name: Generate checksums
        # Bare file names (no ./out/ prefix), so install.sh matches on the asset name.
        run: cd ./out && sha256sum aigw-* | tee checksums.txt
      - name: Publish the latest-main prerelease
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            # Move the tag to the commit the binaries were built from.
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${RELEASE_TAG}" -f sha="$GITHUB_SHA" -F force=true
          else
            gh release create "$RELEASE_TAG" --prerelease --latest=false --target "$GITHUB_SHA" \
              --title "Latest main" --notes "Rolling build of the main branch."
          fi
          # checksums.txt goes last: while the binaries are being replaced, install.sh fails on a
          # checksum mismatch (and asks to retry) rather than installing a mix of old and new.
          gh release upload "$RELEASE_TAG" ./out/aigw-* --clobber
          gh release upload "$RELEASE_TAG" ./out/checksums.txt --clobber
          gh release edit "$RELEASE_TAG" --notes "Rolling build of the main branch, not a stable release.
          Built from ${GITHUB_SHA} on $(date -u +%Y-%m-%dT%H:%M:%SZ).

          Install it with: curl -sSL https://theagentrouter.ai/install.sh | sh"

  aigw_main_release_smoke_test:
    name: Install aigw from latest-main (${{ matrix.os }})
    # Runs the install script against the release just published, to catch what the stubbed
    # tests in tests/install cannot: missing assets, wrong asset names or broken download URLs.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [aigw_main_release]
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest # arm64 (Apple silicon); no Intel macOS binaries are published.
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
      - name: Install aigw
        env:
          AIGW_INSTALL_DIR: ${{ runner.temp }}/aigw-bin
        run: sh site/static/install.sh
      - name: Check the installed version
        run: |
          version="$("${RUNNER_TEMP}/aigw-bin/aigw" version)"
          echo "$version"
          # The binary must be the one built from this commit, not a stale asset.
          case "$version" in
            *"${GITHUB_SHA:0:7}"*) exit 0 ;;
          esac
          # A run for a newer commit may have published since: its own smoke test checks that release.
          tag_sha="$(git ls-remote origin refs/tags/latest-main | cut -f1)"
          if [ -n "$tag_sha" ] && [ "$tag_sha" != "$GITHUB_SHA" ]; then
            echo "::notice::latest-main was updated to ${tag_sha} by a newer run; skipping the version check"
            exit 0
          fi
          echo "::error::expected aigw built from ${GITHUB_SHA}, got: ${version}"
          exit 1

  # Aggregate all the required jobs and make it easier to customize CI required jobs
  ci-required:
    runs-on: ubuntu-latest
    needs:
      - unittest
      - test_crdcel
      - test_controller
      - test_e2e
      - test_e2e_upgrade
      - test_e2e_inference_extension
      - test_data_plane
      - test_data_plane_mcp
      - test_e2e_aigw
      - test_install_script
      - compute_version
    # We need this to run always to force-fail (and not skip) if any needed
    # job has failed. Otherwise, a skipped job will not fail the workflow.
    if: always()
    steps:
      - run: |
          echo "CI required checks completed"
          if [ "${{
              contains(needs.*.result, 'failure') ||
              contains(needs.*.result, 'cancelled')
            }}" == "true" ]; then
            echo "Some required jobs have failed or were cancelled or skipped."
            exit 1
          fi
