header:
  license:
    spdx-id: Apache-2.0
    copyright-owner: Envoy AI Gateway Authors
    content: |
      Copyright Envoy AI Gateway Authors
      SPDX-License-Identifier: Apache-2.0
      The full text of the Apache license is available in the LICENSE file at
      the root of the repo.
  paths-ignore:
    - .git
    - .claude
    - .cursor
    - site
    - out
    - ".github"
    - ".bin"
    - "**/go.mod"
    - "**/go.sum"
    - "**/*.md"
    - "**/*.json"
    - "**/*.txt"
    - "**/*.hcl"
    - "**/.gitignore"
    - "**/.helmignore"
    - .trivyignore
    - .editorconfig
    - .golangci.yml
    - .misspellignore
    - .prettierignore
    - .testcoverage.yml
    - LICENSE
    - CODEOWNERS
    - pre-commit.sh
    - "**/*/server.key"
    - "**/*/server.crt"
    - .env.ollama
    - "**/.env*"
    - tests/internal/testopenai/cassettes
    - .github/codecov.yml
    - hack/
    - .idea/
