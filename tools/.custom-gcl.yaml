# Custom golangci-lint build configuration for kube-api-linter.
#
# This builds a custom golangci-lint binary that includes the kube-api-linter
# plugin. The custom binary is used to lint CRDs for Kubernetes API convention
# compliance without affecting the main golangci-lint version used elsewhere.
version: v2.13.2
name: golangci-kube-api-linter
destination: ./tmp/bin/
plugins:
  - module: "sigs.k8s.io/kube-api-linter"
    version: v0.0.0-20260716143926-092fe0c72997
