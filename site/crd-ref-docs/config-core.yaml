processor:
  # RE2 regular expressions describing types that should be excluded from the generated documentation.
  ignoreTypes:
    - "(EnvoyProxy)List$"
  # RE2 regular expressions describing type fields that should be excluded from the generated documentation.
  ignoreFields:
    - "TypeMeta$"
  customMarkers:
    - name: "notImplementedHide"
      target: "field"

render:
  # Version of Kubernetes to use when generating links to Kubernetes API documentation.
  kubernetesVersion: 1.29
  knownTypes:
    # Envoy Gateway
    - name: APIKeyAuth
      package: github.com/envoyproxy/gateway/api/v1alpha1
      link: https://gateway.envoyproxy.io/docs/api/extension_types/#apikeyauth
    - name: ExtProc
      package: github.com/envoyproxy/gateway/api/v1alpha1
      link: https://gateway.envoyproxy.io/docs/api/extension_types/#extproc
    - name: KubernetesContainerSpec
      package: github.com/envoyproxy/gateway/api/v1alpha1
      link: https://gateway.envoyproxy.io/docs/api/extension_types/#kubernetescontainerspec
    - name: LocalJWKS
      package: github.com/envoyproxy/gateway/api/v1alpha1
      link: https://gateway.envoyproxy.io/docs/api/extension_types/#localjwks
    - name: OIDC
      package: github.com/envoyproxy/gateway/api/v1alpha1
      link: https://gateway.envoyproxy.io/docs/api/extension_types/#oidc
    - name: RemoteJWKS
      package: github.com/envoyproxy/gateway/api/v1alpha1
      link: https://gateway.envoyproxy.io/docs/api/extension_types/#remotejwks

    # Gateway API
    - name: BackendObjectReference
      package: sigs.k8s.io/gateway-api/apis/v1
      link: https://gateway-api.sigs.k8s.io/reference/api-spec/main/spec/#backendobjectreference
    - name: Duration
      package: sigs.k8s.io/gateway-api/apis/v1
      link: https://gateway-api.sigs.k8s.io/reference/api-spec/main/spec/#duration
    - name: HTTPHeader
      package: sigs.k8s.io/gateway-api/apis/v1
      link: https://gateway-api.sigs.k8s.io/reference/api-spec/main/spec/#httpheader
    - name: HTTPHeaderMatch
      package: sigs.k8s.io/gateway-api/apis/v1
      link: https://gateway-api.sigs.k8s.io/reference/api-spec/main/spec/#httpheadermatch
    - name: HTTPRouteTimeouts
      package: sigs.k8s.io/gateway-api/apis/v1
      link: https://gateway-api.sigs.k8s.io/reference/api-spec/main/spec/#httproutetimeouts
    - name: LocalObjectReference
      package: sigs.k8s.io/gateway-api/apis/v1
      link: https://gateway-api.sigs.k8s.io/reference/api-spec/main/spec/#localobjectreference
    - name: LocalPolicyTargetReference
      package: sigs.k8s.io/gateway-api/apis/v1alpha2
      link: https://gateway-api.sigs.k8s.io/reference/api-spec/main/spec/#localpolicytargetreference
    - name: LocalPolicyTargetReferenceWithSectionName
      package: sigs.k8s.io/gateway-api/apis/v1alpha2
      link: https://gateway-api.sigs.k8s.io/reference/api-spec/main/spec/#localpolicytargetreferencewithsectionname
    - name: Namespace
      package: sigs.k8s.io/gateway-api/apis/v1
      link: https://gateway-api.sigs.k8s.io/reference/api-spec/main/spec/#namespace
    - name: ParentReference
      package: sigs.k8s.io/gateway-api/apis/v1
      link: https://gateway-api.sigs.k8s.io/reference/api-spec/main/spec/#parentreference
    - name: PolicyStatus
      package: sigs.k8s.io/gateway-api/apis/v1alpha2
