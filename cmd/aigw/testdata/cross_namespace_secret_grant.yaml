# Allows the BackendSecurityPolicy in cross_namespace_secret.yaml to reference its Secret.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-default-backend-security-policies
  namespace: shared
spec:
  from:
    - group: aigateway.envoyproxy.io
      kind: BackendSecurityPolicy
      namespace: default
  to:
    - group: ""
      kind: Secret
