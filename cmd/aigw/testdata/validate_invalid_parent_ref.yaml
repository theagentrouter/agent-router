# Invalid: parentRef uses kind: HTTPRoute instead of kind: Gateway.
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIGatewayRoute
metadata:
  name: invalid-parent-ref
  namespace: default
spec:
  parentRefs:
    - name: some-gateway
      kind: HTTPRoute
      group: gateway.networking.k8s.io
  rules:
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: gpt-4o-mini
      backendRefs:
        - name: some-backend
